      </div>
      <div class="mfield-group">
        <label class="mlabel">پیامی که به کاربران نمایش داده می‌شود</label>
        <textarea class="ta" id="appStatusMsg" style="min-height:70px">${esc(state.appStatus.message || DEFAULT_MAINTENANCE_MSG)}</textarea>
      </div>
      <div style="display:flex;gap:10px">
        ${closed
          ? `<button class="btn-confirm" id="appStatusToggleBtn" style="flex:1">${icon('power',14)} باز کردن برنامه</button>`
          : `<button class="btn-danger" id="appStatusToggleBtn" style="flex:1">${icon('power',14)} بستن برنامه</button>`}
      </div>
    `;
    document.getElementById('appStatusToggleBtn').addEventListener('click', () => saveAppStatus(!closed));
  }

  async function saveAppStatus(closed){
    const msgEl = document.getElementById('appStatusMsg');
    const message = (msgEl ? msgEl.value.trim() : state.appStatus.message) || DEFAULT_MAINTENANCE_MSG;
    if (closed && !confirm('مطمئنی می‌خوای برنامه رو برای همه‌ی کاربران ببندی؟')) return;
    try {
      await fbDb.ref('appStatus').set({ closed: !!closed, message, updatedAt: Date.now() });
      state.appStatus = { closed: !!closed, message };
      toast(closed ? 'برنامه بسته شد' : 'برنامه باز شد', 'ok');
      paintAppStatus();
    } catch(e) { toast('خطا در ذخیره‌سازی وضعیت برنامه', 'err'); }
  }

  // --- کلید مرکزی Gemini — aiConfig/geminiKey ---
  // فقط از همین پنل مدیریت نوشته/خونده می‌شه؛ کاربرهای عادی فقط وقتی permissions/{uid}/canUseAi
  // روشون true باشه می‌تونن (طبق قوانین امنیتی فایربیس) این مسیر رو بخونن. نگاه کن به index.html
  // (تابع attachAiAccessListener) برای دیدن این‌که اپ اصلی چطور ازش استفاده می‌کنه.
  async function loadAiConfig(){
    try {
      const [keysSnap, modelSnap, legacySnap] = await Promise.all([
        fbDb.ref('aiConfig/geminiKeys').once('value'),
        fbDb.ref('aiConfig/geminiModel').once('value'),
        fbDb.ref('aiConfig/geminiKey').once('value'),
      ]);
      const rawKeys = keysSnap.val();
      let keys = Array.isArray(rawKeys) ? rawKeys.filter((k) => k && String(k).trim()) : [];
      if (!keys.length) {
        // سازگاری با نسخه‌ی قدیمی که فقط یک کلید تکی داشت
        const legacy = (legacySnap.val() || '').trim();
        if (legacy) keys = [legacy];
      }
      state.aiConfigKeys = keys;
      state.aiConfigModel = modelSnap.val() || DEFAULT_GEMINI_MODEL;
      state.aiConfigLoaded = true;
    } catch(e) {
      console.error('loadAiConfig error:', e);
      state.aiConfigKeys = [];
      state.aiConfigModel = DEFAULT_GEMINI_MODEL;
    }
  }

  function maskKey(key){
    const k = String(key || '');
    if (k.length <= 8) return k.replace(/./g, '•');
    return k.slice(0, 4) + '•'.repeat(Math.max(4, k.length - 8)) + k.slice(-4);
  }

  function paintAiConfig(){
    const wrap = document.getElementById('aiConfigWrap');
    if (!wrap) return;
    const keys = state.aiConfigKeys || [];
    const hasKey = keys.length > 0;
    const model = state.aiConfigModel || DEFAULT_GEMINI_MODEL;
    wrap.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:10px 13px;margin-bottom:14px">
        <span style="font-size:13px">${hasKey ? `${keys.length} کلید Gemini ذخیره شده` : 'هنوز کلیدی ذخیره نشده'}</span>
        <span class="pill ${hasKey ? 'active' : 'banned'}">${hasKey ? icon('check',11) + ' فعال' : icon('ban',11) + ' خالی'}</span>
      </div>
      <div class="mfield-group">
        <label class="mlabel">مدل Gemini فعال</label>
        <select class="mfield" id="aiConfigModelSelect">
          ${AVAILABLE_GEMINI_MODELS.map((m) => `<option value="${esc(m)}" ${m === model ? 'selected' : ''}>${esc(m)}</option>`).join('')}
        </select>
        <p style="color:var(--muted);font-size:12px;margin:6px 0 0">همه‌ی کاربرها و خودِ این پنل از همین یک مدل استفاده می‌کنن.</p>
      </div>
      <div class="mfield-group">
        <label class="mlabel">کلیدهای Gemini API (${keys.length})</label>
        <p style="color:var(--muted);font-size:12px;margin:0 0 10px">هر چند کلید که این‌جا اضافه کنی، درخواست‌ها به‌صورت خودکار (چرخشی) بینشون تقسیم می‌شه تا سقف رایگانِ روزانه‌ی چند کلید روی هم جمع بشه.</p>
        ${keys.map((k, i) => `
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <input class="mfield" style="flex:1;font-family:monospace" type="text" readonly value="${esc(state.showAiConfigKeys ? k : maskKey(k))}">
            <button class="icon-btn" data-remove-key-idx="${i}" title="حذف این کلید">${icon('trash',14)}</button>
          </div>
        `).join('')}
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <input class="mfield" id="aiConfigNewKeyInput" style="flex:1" type="${state.showAiConfigKeys ? 'text' : 'password'}" placeholder="AQ.... (کلید جدید)" value="${esc(state.aiConfigNewKeyDraft || '')}">
          <button class="icon-btn" id="aiConfigKeyToggleBtn" title="نمایش/مخفی همه‌ی کلیدها">${icon(state.showAiConfigKeys ? 'ban' : 'check', 14)}</button>
          <button class="btn-confirm" id="aiConfigAddKeyBtn" style="width:auto;padding:10px 16px">افزودن کلید</button>
        </div>
      </div>
      <button class="btn-confirm" id="aiConfigSaveModelBtn" style="width:auto;padding:10px 20px">ذخیره‌ی مدل</button>
    `;
    document.getElementById('aiConfigKeyToggleBtn').addEventListener('click', () => {
      state.showAiConfigKeys = !state.showAiConfigKeys;
      paintAiConfig();
    });
    document.getElementById('aiConfigAddKeyBtn').addEventListener('click', addAiConfigKey);
    document.getElementById('aiConfigSaveModelBtn').addEventListener('click', saveAiConfigModel);
    wrap.querySelectorAll('[data-remove-key-idx]').forEach((btn) => {
      btn.addEventListener('click', () => removeAiConfigKey(parseInt(btn.getAttribute('data-remove-key-idx'), 10)));
    });
  }

  async function persistAiConfigKeys(keys){
    try {
      await fbDb.ref('aiConfig/geminiKeys').set(keys);
      // کلید قدیمیِ تکی رو هم پاک می‌کنیم که دیگه به‌عنوان fallback استفاده نشه و گیج‌کننده نباشه
      await fbDb.ref('aiConfig/geminiKey').remove().catch(() => {});
      state.aiConfigKeys = keys;
      return true;
    } catch(e) {
      toast('خطا در ذخیره‌سازی کلیدها', 'err');
      return false;
    }
  }

  async function addAiConfigKey(){
    const el = document.getElementById('aiConfigNewKeyInput');
    const key = el ? el.value.trim() : '';
    if (!key) { toast('اول یک کلید وارد کن', 'err'); return; }
    const keys = [...(state.aiConfigKeys || []), key];
    state.aiConfigNewKeyDraft = '';
    const ok = await persistAiConfigKeys(keys);
    if (ok) toast('کلید اضافه شد', 'ok');
    paintAiConfig();
  }

  async function removeAiConfigKey(idx){
    const keys = (state.aiConfigKeys || []).filter((_, i) => i !== idx);
    const ok = await persistAiConfigKeys(keys);
    if (ok) toast('کلید حذف شد', 'ok');
    paintAiConfig();
  }

  async function saveAiConfigModel(){
    const el = document.getElementById('aiConfigModelSelect');
    const model = el ? el.value : DEFAULT_GEMINI_MODEL;
    try {
      await fbDb.ref('aiConfig/geminiModel').set(model);
      state.aiConfigModel = model;
      toast('مدل ذخیره شد', 'ok');
      paintAiConfig();
    } catch(e) { toast('خطا در ذخیره‌سازی مدل', 'err'); }
  }

  async function loadBroadcasts(){
    try {
      const snap = await fbDb.ref('broadcastNotifications').orderByChild('createdAt').limitToLast(50).once('value');
      const val = snap.val() || {};
      state.broadcasts = Object.keys(val).map(id => ({ id, ...val[id] })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      state.broadcastsLoaded = true;
    } catch(e) {
      console.error('loadBroadcasts error:', e);
      state.broadcasts = [];
    }
  }

  function paintBroadcastList(){
    const wrap = document.getElementById('broadcastListWrap');
    if (!wrap) return;
    if (state.broadcasts.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${icon('bell', 46)}<p>هنوز نوتیفیکیشنی ارسال نشده.</p></div>`;
      return;
    }
    const now = Date.now();
    wrap.innerHTML = state.broadcasts.map(b => {
      const pending = (b.sendAt || 0) > now;
      return `
        <div class="index-card" style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px">
            <span class="mono" style="font-size:11px;color:var(--placeholder)">${fmtDate(b.createdAt)}</span>
            <span class="pill ${pending ? 'open' : 'answered'}">${pending ? 'زمان‌بندی‌شده · ' + fmtDate(b.sendAt) : 'ارسال شده'}</span>
          </div>
          <div style="font-size:13px;line-height:1.8">${esc(b.message || '')}</div>
          <div style="margin-top:10px">
            <button class="btn-small" onclick="__admin.${pending ? 'cancelBroadcast' : 'deleteBroadcast'}('${esc(b.id)}')">${icon('trash',12)} ${pending ? 'لغو ارسال' : 'حذف برای همه'}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function sendBroadcast(){
    const msgEl = document.getElementById('bcMessage');
    const message = msgEl ? msgEl.value.trim() : '';
    if (!message) { toast('متن نوتیفیکیشن نمی‌تونه خالی باشه', 'err'); return; }
    const delaySel = document.getElementById('bcDelay').value;
    const now = Date.now();
    let sendAt;
    if (delaySel === 'exact') {
      const raw = document.getElementById('bcExactDateTime').value;
      if (!raw) { toast('تاریخ و ساعت ارسال رو انتخاب کن', 'err'); return; }
      sendAt = new Date(raw).getTime();
      if (isNaN(sendAt)) { toast('تاریخ و ساعت وارد شده معتبر نیست', 'err'); return; }
      if (sendAt < now) { toast('این زمان قبلاً گذشته؛ یه زمان در آینده انتخاب کن', 'err'); return; }
    } else {
      let delayHours = 0;
      if (delaySel === 'custom') {
        delayHours = parseFloat(document.getElementById('bcCustomHours').value) || 0;
      } else {
        delayHours = parseFloat(delaySel) || 0;
      }
      sendAt = now + Math.max(0, delayHours) * 3600000;
    }
    try {
      const ref = fbDb.ref('broadcastNotifications').push();
      await ref.set({ message, createdAt: now, sendAt, createdBy: state.email || state.uid || null });
      toast(sendAt > now ? 'نوتیفیکیشن زمان‌بندی شد' : 'نوتیفیکیشن ارسال شد', 'ok');
      msgEl.value = '';
      await loadBroadcasts();
      paintBroadcastList();
    } catch(e) { toast('خطا در ارسال نوتیفیکیشن', 'err'); }
  }

  async function cancelBroadcast(id){
    if (!confirm('این نوتیفیکیشن زمان‌بندی‌شده لغو شود؟')) return;
    try {
      await fbDb.ref('broadcastNotifications/' + id).remove();
      state.broadcasts = state.broadcasts.filter(b => b.id !== id);
      toast('لغو شد', 'ok');
      paintBroadcastList();
    } catch(e) { toast('خطا در لغو', 'err'); }
  }

  async function deleteBroadcast(id){
    if (!confirm('این نوتیفیکیشن حذف بشه؟ چون همه‌ی کاربرها مستقیم از همین مسیر می‌خوننش، برای اونا هم دیگه توی لیست نوتیفیکیشن‌های داخل اپ نمایش داده نمی‌شه (نوتیفیکیشنی که قبلاً به‌صورت pop-up روی گوشی‌شون نشون داده شده، از همون‌جا پاک نمی‌شه — این حذف فقط کارت داخل اپ رو برمی‌داره).')) return;
    try {
      await fbDb.ref('broadcastNotifications/' + id).remove();
      state.broadcasts = state.broadcasts.filter(b => b.id !== id);
      toast('حذف شد', 'ok');
      paintBroadcastList();
    } catch(e) { toast('خطا در حذف', 'err'); }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw-admin.js').catch((e) => console.error('Admin SW registration failed', e));
    });
  }
})();
</script>
</body>
</html>
