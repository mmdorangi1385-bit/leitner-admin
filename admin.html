<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت · جعبه لایتنر</title>
<link rel="icon" href="icon-hero.png">
<link rel="manifest" href="manifest-admin.json">
<link rel="apple-touch-icon" href="icon-hero.png">
<meta name="theme-color" content="#14161f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پنل مدیریت">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #14161f; --bg-radial: #1c2033; --panel: #1e2230; --panel2: #262b3d; --panel3: #2c3145;
    --ivory: #ede6d6; --text: #ede6d6; --muted: #9aa0b4; --placeholder: #6b7189;
    --brass: #c9a66b; --brass-dark: #a9824f; --brass-glow: rgba(201,166,107,0.16);
    --wine: #b65c5c; --wine-glow: rgba(182,92,92,0.16);
    --sage: #8fa37a; --sage-strong: #4fb86a; --sage-glow: rgba(79,184,106,0.16);
    --teal: #3fc1c9; --teal-dark: #2b969d; --teal-glow: rgba(63,193,201,0.14);
    --violet: #8B6FC9;
    --border: #333854; --border2: #3c4260; --divider: #292d40;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f3f0e8; --bg-radial: #ffffff; --panel: #ffffff; --panel2: #f1ede2; --panel3: #e9e3d4;
    --ivory: #2a271f; --text: #2a271f; --muted: #7a7566; --placeholder: #a39d8c;
    --brass: #a9824f; --brass-dark: #8a6a3e; --brass-glow: rgba(169,130,79,0.14);
    --wine: #b6504f; --wine-glow: rgba(182,80,79,0.12);
    --sage: #6c8a56; --sage-strong: #3f9556; --sage-glow: rgba(63,149,86,0.14);
    --teal: #2b969d; --teal-dark: #1f7278; --teal-glow: rgba(43,150,157,0.12);
    --violet: #7457b0;
    --border: #e2ddd0; --border2: #d6cfbd; --divider: #eae5d9;
    --shadow: 0 6px 18px rgba(60,50,30,0.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--bg-radial) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(139,111,201,0.08) 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  ::selection { background: var(--brass-glow); color: var(--brass); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }

  /* ---------- Auth gate ---------- */
  #authGate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 18px; padding: 32px 28px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .auth-card::before {
    content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 6px;
    background: repeating-linear-gradient(180deg, var(--brass) 0 14px, transparent 14px 22px);
    opacity: 0.55;
  }
  .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .auth-brand .box-icon { width: 34px; height: 34px; flex-shrink: 0; }
  .box-icon.img-logo { border-radius: 8px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .auth-brand h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .auth-sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 24px; line-height: 1.7; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--brass); }
  .btn-primary {
    width: 100%; background: var(--brass); color: #1a1710; border: none; border-radius: 10px;
    padding: 12px; font-size: 14px; font-weight: 700; margin-top: 6px; transition: filter 0.15s, transform 0.1s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-error {
    background: var(--wine-glow); border: 1px solid rgba(182,92,92,0.35); color: #e0a3a3;
    border-radius: 8px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 14px; display: none; line-height: 1.6;
  }

  /* ---------- App shell ---------- */
  #app { display: none; min-height: 100vh; }
  #app.show { display: flex; }

  .sidebar {
    width: 208px; flex-shrink: 0; background: var(--panel); border-inline-end: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 14px 10px; gap: 3px; position: sticky; top: 0; height: 100vh;
  }
  .side-brand { display: flex; align-items: center; gap: 8px; padding: 4px 6px 14px; }
  .side-brand .box-icon { width: 24px; height: 24px; flex-shrink: 0; }
  .side-brand span { font-size: 13.5px; font-weight: 700; }
  .side-brand small { display: block; color: var(--muted); font-size: 10px; font-weight: 400; margin-top: 1px; }

  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--border2); color: var(--muted);
    border-radius: 9px; padding: 7px; font-size: 11.5px; font-weight: 500; width: 100%;
    margin-bottom: 8px; transition: border-color 0.15s, color 0.15s;
  }
  .theme-toggle:hover { border-color: var(--brass); color: var(--text); }
  .theme-toggle svg { width: 14px; height: 14px; flex-shrink: 0; }

  .drawer-tab {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 9px;
    background: none; color: var(--muted); font-size: 12.5px; font-weight: 500; position: relative;
    border: 1px solid transparent; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .drawer-tab:hover { background: var(--panel2); color: var(--text); }
  .drawer-tab.active { background: var(--panel2); color: var(--brass); border-color: var(--border2); }
  .drawer-tab.active::before {
    content: ''; position: absolute; inset-inline-start: -12px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 16px; background: var(--brass); border-radius: 3px;
  }
  .drawer-tab .dtab-icon { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.9; }
  .drawer-tab .badge-count {
    margin-inline-start: auto; background: var(--wine); color: #fff; font-size: 10px; font-weight: 700;
    border-radius: 20px; padding: 1px 6px; font-family: 'JetBrains Mono', monospace;
  }
  .sidebar-foot { margin-top: auto; padding: 8px 6px 2px; border-top: 1px solid var(--divider); }
  .sidebar-foot .who { font-size: 11px; color: var(--muted); margin-bottom: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-ghost {
    width: 100%; background: transparent; border: 1px solid var(--border2); color: var(--muted);
    border-radius: 9px; padding: 7px; font-size: 12px; transition: border-color 0.15s, color 0.15s;
  }
  .btn-ghost:hover { border-color: var(--wine); color: #e0a3a3; }

  .main { flex: 1; min-width: 0; padding: 22px 26px 50px; max-width: 1180px; }
  .page-head { margin-bottom: 18px; }
  .page-head h2 { font-size: 17px; margin: 0 0 3px; font-weight: 700; }
  .page-head p { color: var(--muted); font-size: 12px; margin: 0; }

  /* ---------- Cards / index-card motif ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .index-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px;
    position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .index-card::before {
    content: ''; position: absolute; inset-inline-start: 20px; top: 0; width: 30px; height: 7px;
    background: var(--panel3); border: 1px solid var(--border2); border-top: none;
    border-radius: 0 0 5px 5px; opacity: 0.7;
  }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px; margin-bottom: 18px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat-card .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .stat-card .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 21px; font-weight: 600; }
  .stat-card .stat-value.brass { color: var(--brass); }
  .stat-card .stat-value.sage { color: var(--sage-strong); }
  .stat-card .stat-value.teal { color: var(--teal); }
  .stat-card .stat-value.wine { color: var(--wine); }
  .stat-card .stat-sub { font-size: 10.5px; color: var(--placeholder); margin-top: 3px; }

  .league-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 20px;
    font-size: 11px; font-weight: 600; border: 1px solid transparent;
  }
  .league-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .lesson-row {
    display: flex; align-items: center; gap: 11px; padding: 10px 13px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 11px; margin-bottom: 8px;
  }
  .lesson-flag { font-size: 18px; }
  .lesson-name { font-weight: 600; font-size: 12.5px; flex-shrink: 0; width: 84px; }
  .presence-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage-strong); box-shadow: 0 0 0 3px var(--sage-glow); }
  .lesson-stats { display: flex; gap: 14px; margin-inline-start: auto; }
  .lesson-stats .ls { text-align: center; }
  .lesson-stats .ls .n { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; }
  .lesson-stats .ls .l { font-size: 9.5px; color: var(--muted); }
  .btn-small {
    background: var(--panel2); border: 1px solid var(--border2); color: var(--text); border-radius: 8px;
    padding: 6px 11px; font-size: 11.5px; font-weight: 500; transition: border-color 0.15s;
  }
  .btn-small:hover { border-color: var(--brass); }

  .online-user-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--border2);
    border-radius: 20px; padding: 4px 10px 4px 7px; font-size: 11.5px; margin: 3px;
  }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th {
    text-align: right; color: var(--muted); font-weight: 500; font-size: 11px; padding: 7px 10px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--divider); vertical-align: middle; }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table tr:hover td { background: rgba(255,255,255,0.015); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 600; }
  .pill.open { background: var(--wine-glow); color: #e0a3a3; }
  .pill.answered { background: var(--sage-glow); color: var(--sage-strong); }
  .pill.closed { background: rgba(154,160,180,0.14); color: var(--muted); }
  .pill.banned { background: var(--wine-glow); color: #e0a3a3; }
  .pill.active { background: var(--sage-glow); color: var(--sage-strong); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 13px; flex-wrap: wrap; }
  .search-input {
    background: var(--panel); border: 1px solid var(--border2); color: var(--text); border-radius: 10px;
    padding: 8px 12px; font-size: 12.5px; min-width: 200px; outline: none;
  }
  .search-input:focus { border-color: var(--brass); }
  select.filter-select {
    background: var(--panel); border: 1px solid var(--border2); color: var(--text); border-radius: 10px;
    padding: 8px 11px; font-size: 12.5px; outline: none;
  }

  .icon-btn {
    width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; color: var(--muted);
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--brass); }
  .icon-btn svg { width: 14px; height: 14px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,11,17,0.65); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  [data-theme="light"] .modal-backdrop { background: rgba(40,35,25,0.35); }
  .modal-card {
    background: var(--panel); border: 1px solid var(--border2); border-radius: 15px; padding: 20px;
    width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow);
  }
  .modal-card h3 { margin: 0 0 4px; font-size: 16px; }
  .modal-card .modal-sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-secondary {
    flex: 1; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600;
  }
  .btn-danger {
    flex: 1; background: var(--wine); border: none; color: #fff; border-radius: 10px; padding: 10px;
    font-size: 13px; font-weight: 700;
  }
  .btn-confirm {
    flex: 1; background: var(--sage-strong); border: none; color: #0e1a10; border-radius: 10px; padding: 10px;
    font-size: 13px; font-weight: 700;
  }
  textarea.ta {
    width: 100%; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; outline: none; resize: vertical; min-height: 80px;
    line-height: 1.65; font-family: inherit;
  }
  textarea.ta:focus, input.mfield:focus { border-color: var(--brass); }
  input.mfield {
    width: 100%; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 9px 11px; font-size: 13px; outline: none;
  }
  .mfield-row { display: flex; gap: 9px; }
  .mfield-row > div { flex: 1; }
  .mlabel { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; }
  .mfield-group { margin-bottom: 11px; }

  .empty-state {
    text-align: center; padding: 46px 18px; color: var(--muted);
  }
  .empty-state svg { width: 38px; height: 38px; opacity: 0.35; margin-bottom: 12px; }
  .empty-state p { font-size: 12.5px; margin: 0; }

  .loading-spin {
    display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--brass); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--panel3); border: 1px solid var(--border2); color: var(--text); padding: 10px 18px;
    border-radius: 30px; font-size: 12.5px; box-shadow: var(--shadow); animation: toastIn 0.2s ease;
  }
  .toast.ok { border-color: rgba(79,184,106,0.4); }
  .toast.err { border-color: rgba(182,92,92,0.4); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }

  /* ---------- AI Assistant chat ---------- */
  .ai-chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 150px); max-height: 720px; }
  .ai-chat-log { flex: 1; overflow-y: auto; padding: 4px 2px 14px; display: flex; flex-direction: column; gap: 12px; }
  .ai-msg { max-width: 82%; padding: 11px 14px; border-radius: 13px; font-size: 13px; line-height: 1.85; white-space: pre-wrap; }
  .ai-msg.user { align-self: flex-end; background: var(--brass); color: #1a1710; border-bottom-left-radius: 4px; font-weight: 500; }
  .ai-msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .ai-msg.bot.err { border-color: rgba(182,92,92,0.4); color: #e0a3a3; }
  .ai-action-card { align-self: flex-start; max-width: 92%; width: 100%; background: var(--panel); border: 1px solid var(--border2); border-radius: 13px; padding: 14px 16px; }
  .ai-action-card .aic-summary { font-size: 13px; line-height: 1.8; margin-bottom: 12px; }
  .ai-action-item { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; margin-bottom: 7px; font-size: 12.5px; }
  .ai-action-item:last-child { margin-bottom: 0; }
  .ai-action-item .aic-num { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--brass-glow); color: var(--brass); font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; }
  .ai-action-item .aic-label { color: var(--muted); font-size: 10.5px; flex-shrink: 0; }
  .ai-action-item .aic-target { font-weight: 600; }
  .ai-action-item .aic-detail { color: var(--muted); font-size: 11.5px; margin-inline-start: auto; }
  .ai-action-item.aic-failed { border-color: rgba(182,92,92,0.4); }
  .ai-action-item .aic-status { flex-shrink: 0; }
  .ai-actions-footer { display: flex; gap: 10px; margin-top: 14px; }
  .ai-chat-inputbar { display: flex; gap: 9px; padding-top: 12px; border-top: 1px solid var(--divider); }
  .ai-chat-inputbar textarea { flex: 1; resize: none; min-height: 46px; max-height: 130px; }
  .ai-send-btn { flex-shrink: 0; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: var(--brass); color: #1a1710; border: none; border-radius: 11px; transition: filter 0.15s; }
  .ai-send-btn:hover { filter: brightness(1.08); }
  .ai-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ai-send-btn svg { width: 18px; height: 18px; }
  .ai-no-key { text-align: center; padding: 50px 18px; color: var(--muted); }
  .ai-no-key svg { width: 40px; height: 40px; opacity: 0.35; margin-bottom: 14px; }
  .ai-typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .ai-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: aiTyping 1.1s infinite ease-in-out; }
  .ai-typing span:nth-child(2) { animation-delay: 0.15s; }
  .ai-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes aiTyping { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  .tab-strip { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--divider); overflow-x: auto; }
  .tab-strip button {
    background: none; border: none; color: var(--muted); font-size: 12.5px; padding: 8px 3px; margin-inline-end: 15px;
    border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; flex-shrink: 0;
  }
  .tab-strip button.active { color: var(--brass); border-color: var(--brass); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

  @media (max-width: 860px) {
    #app.show { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: sticky; top: 0; z-index: 50;
      flex-direction: row; padding: 8px 10px; gap: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      border-inline-end: none; border-bottom: 1px solid var(--border);
    }
    .side-brand, .sidebar-foot { display: none; }
    .theme-toggle {
      width: auto; flex-shrink: 0; margin-bottom: 0; padding: 0; border: none; background: none;
      align-self: center;
    }
    .theme-toggle span { display: none; }
    .theme-toggle svg { width: 19px; height: 19px; }
    /* #drawerTabs is the only visible child of .sidebar on mobile — it needs its own
       horizontal flex layout, otherwise each .drawer-tab (which is display:flex) collapses
       to a block box and the tabs stack on top of each other instead of sitting in a row. */
    #drawerTabs {

  async function loadNewUsersStats(){
    const DAY = 86400000;
    const empty = { day: 0, week: 0, month: 0, sixMonth: 0 };
    try {
      const snap = await fbDb.ref('users').once('value');
      const val = snap.val() || {};
      const now = Date.now();
      const result = { ...empty };
      Object.keys(val).forEach((uid) => {
        const createdAt = val[uid] && val[uid].createdAt;
        if (typeof createdAt !== 'number') return;
        const diff = now - createdAt;
        if (diff < 0) return;
        if (diff <= DAY) result.day++;
        if (diff <= 7 * DAY) result.week++;
        if (diff <= 30 * DAY) result.month++;
        if (diff <= 182 * DAY) result.sixMonth++;
      });
      return result;
    } catch (e) {
      console.error('loadNewUsersStats error:', e);
      return empty;
    }
  }

  function fmtBytes(bytes){
    bytes = Number(bytes) || 0;
    if (bytes <= 0) return '۰ کیلوبایت';
    const units = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت'];
    let i = 0;
    let val = bytes;
    while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
    const rounded = val >= 100 ? Math.round(val) : Math.round(val * 10) / 10;
    return faNum(rounded) + ' ' + units[i];
  }

  async function loadMediaStats(){
    const empty = { count: 0, totalBytes: 0 };
    const out = { image: { ...empty }, video: { ...empty }, audio: { ...empty } };
    try {
      const snap = await fbDb.ref('mediaStats').once('value');
      const val = snap.val() || {};
      ['image', 'video', 'audio'].forEach((type) => {
        const entry = val[type];
        if (entry) out[type] = { count: entry.count || 0, totalBytes: entry.totalBytes || 0 };
      });
    } catch (e) {
      console.error('loadMediaStats error:', e);
    }
    return out;
  }

            <input type="checkbox" id="editCanAi" ${canAi ? 'checked' : ''} style="opacity:0;width:0;height:0">

          <button class="btn-confirm" id="editSaveBtn">ذخیره تغییرات</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const checkbox = backdrop.querySelector('#editCanGroup');
    const track = backdrop.querySelector('#toggleTrackGroup');
    checkbox.addEventListener('change', () => {
      track.style.background = checkbox.checked ? 'var(--sage-strong)' : 'var(--border2)';
    });
    const aiCheckbox = backdrop.querySelector('#editCanAi');
    const aiTrack = backdrop.querySelector('#toggleTrackAi');
    aiCheckbox.addEventListener('change', () => {
      aiTrack.style.background = aiCheckbox.checked ? 'var(--sage-strong)' : 'var(--border2)';
    });
    backdrop.addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#editCancelBtn').addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#editSaveBtn').addEventListener('click', async () => {
      const newName = backdrop.querySelector('#editName').value.trim();
      const newBonus = parseInt(backdrop.querySelector('#editXpBonus').value, 10) || 0;
      const newCoins = parseInt(backdrop.querySelector('#editWalletCoins').value, 10);
      const coinsChanged = !isNaN(newCoins) && newCoins !== coins;
      const newCanGroup = checkbox.checked;
      const newCanAi = aiCheckbox.checked;
      let newMaxIdChanges = parseInt(backdrop.querySelector('#editIdMaxChanges').value, 10);
      if (isNaN(newMaxIdChanges) || newMaxIdChanges < 0) newMaxIdChanges = DEFAULT_USER_ID_MAX_CHANGES;
      try {
        const writes = [
          fbDb.ref('leaderboard/' + uid).update({ name: newName || u.name || 'کاربر' }),
          fbDb.ref('users/' + uid + '/adminXpBonus').set(newBonus),
          fbDb.ref('permissions/' + uid + '/canCreateGroups').set(newCanGroup),
          fbDb.ref('permissions/' + uid + '/canUseAi').set(newCanAi),
          fbDb.ref('permissions/' + uid + '/userIdMaxChanges').set(newMaxIdChanges),
        ];
        if (coinsChanged) {
          writes.push(fbDb.ref('users/' + uid + '/wallet').update({ coins: Math.max(0, newCoins), lastUpdated: Date.now() }));
          writes.push(fbDb.ref('users/' + uid + '/walletHistory').push({
            type: newCoins > coins ? 'earn' : 'spend', amount: newCoins - coins, reason: 'admin_adjustment', at: Date.now(),
          }));
        }
        await Promise.all(writes);
        u.name = newName || u.name;
        if (!state.userXpBonusCache) state.userXpBonusCache = {};
        state.userXpBonusCache[uid] = newBonus;
        if (coinsChanged) {
          if (!state.userWalletCache) state.userWalletCache = {};
          state.userWalletCache[uid] = Math.max(0, newCoins);
        }
        state.permissions[uid] = newCanGroup;
        if (!state.aiPermissions) state.aiPermissions = {};
        state.aiPermissions[uid] = newCanAi;
        if (!state.userIdMaxChangesCache) state.userIdMaxChangesCache = {};
        state.userIdMaxChangesCache[uid] = newMaxIdChanges;
        toast('تغییرات ذخیره شد', 'ok');
        backdrop.remove();
        paintUserTable();
      } catch(e) { toast('خطا در ذخیره‌سازی', 'err'); }
    });
  }

  // ===================== دستیار هوشمند (چت فارسی → JSON Action) =====================
  const AI_ASSISTANT_SYSTEM_PROMPT = `شما یک دستیار هوشمند، دقیق و قدرتمند برای مدیریت «پنل مدیریت جعبه لایتنر» هستید. وظیفه شما دریافت دستورات متنی مدیر، تحلیل درخواست، و خروجی دادن به‌صورت JSON ساختاریافته است تا پنل بتواند عملیات را روی فایربیس اجرا کند.

قوانین حیاتی خروجی:
- خروجی شما فقط و فقط یک آبجکت JSON خام است. هیچ متن، توضیح، یا Markdown دور آن نباشد (بدون \`\`\`json).
- ساختار خروجی همیشه این شکل است:
{
  "reply": "پاسخ کوتاه و طبیعی فارسی به مدیر (همیشه پر می‌شود)",
  "actions": [ ...لیست صفر یا چند اکشن... ]
}
- اگر درخواست، اجرایی نیست (سوال آماری، گزارش، سلام و احوالپرسی، یا هرچیزی که اکشن روی دیتابیس نیاز ندارد)، آرایه‌ی actions را خالی [] بگذارید و فقط reply را پر کنید.
- اگر درخواست شامل چند نفر یا چند مورد است (مثلاً "این ۱۰ کاربر رو مسدود کن")، برای هرکدام یک آبجکت اکشن جداگانه در آرایه actions بسازید — هرگز چند نفر را در یک اکشن ادغام نکنید.
- برای هر اکشن، uid کاربر را از روی لیست کاربران داده‌شده (طبق نام یا آیدی کاربری که ذکر شده) پیدا کنید. اگر کاربری با آن نام/آیدی پیدا نشد، آن مورد را در actions نگذارید و در reply توضیح بدهید کدام مورد پیدا نشد.
- هرگز uid را حدس نزنید یا از پیش خودتان نسازید؛ فقط از لیست کاربران داده‌شده استفاده کنید.

انواع مجاز action.type و پارامترهای هرکدام:
1. BAN_USER: { type, uid, displayLabel, banType: "permanent"|"1"|"7"|"30", reason }
2. UNBAN_USER: { type, uid, displayLabel }
3. UPDATE_USER_PERMISSIONS: { type, uid, displayLabel, canCreateGroups?, canUseAi?, userIdMaxChanges? } — فقط فیلدهایی که کاربر گفته را بگذارید
4. GRANT_XP_BONUS: { type, uid, displayLabel, amount } — amount عدد است (جایگزین بونوس فعلی می‌شود مگر گفته شود «اضافه کن» که باید مقدار جدید را خودتان جمع بزنید چون مقدار فعلی هر کاربر در لیست داده شده)
5. UPDATE_USER_NAME: { type, uid, displayLabel, newName }
6. REPLY_TICKET: { type, ticketId, displayLabel, replyText }
7. SET_TICKET_STATUS: { type, ticketId, displayLabel, status: "open"|"closed" }
8. DELETE_TICKET: { type, ticketId, displayLabel }
9. CREATE_BROADCAST: { type, message, sendAtTimestamp, displayLabel } — sendAtTimestamp میلی‌ثانیه یونیکس؛ اگر «همین الان» بود از زمان فعلی داده‌شده استفاده کنید
10. CANCEL_BROADCAST: { type, broadcastId, displayLabel }
11. SET_APP_STATUS: { type, closed: true|false, message, displayLabel }
12. UPDATE_ITEM_PRICE: { type, itemId, displayLabel, coinPrice?, cashPrice? } — قیمت آیتم مارکت را تغییر می‌دهد؛ فقط فیلدهای گفته‌شده را بگذارید
13. APPLY_DISCOUNT: { type, itemId, displayLabel, kind: "percent"|"amount", value, startAtTimestamp?, endAtTimestamp? } — اگر زمان گفته نشد، startAtTimestamp را زمان فعلی بگذارید و endAtTimestamp را خالی/نال
14. REMOVE_DISCOUNT: { type, itemId, displayLabel }
15. SCHEDULE_ITEM_PUBLISH: { type, itemId, displayLabel, publishAtTimestamp } — زمان‌بندی انتشار محصول؛ میلی‌ثانیه یونیکس
16. SET_ITEM_ACTIVE: { type, itemId, displayLabel, active: true|false } — فعال/غیرفعال کردن نمایش آیتم در مارکت
17. SET_ITEM_FREE: { type, itemId, displayLabel, free: true|false } — رایگان کردن یا لغو رایگان‌بودن آیتم
18. CREATE_ITEM: { type, displayLabel, name, description?, itemType?: "theme"|"frame"|"decoration"|"badge"|"other", categoryId?, coinPrice?, cashPrice?, free? } — ساخت آیتم جدید در مارکت (بدون فایل/تصویر؛ مدیر بعداً فایل را از پنل آپلود می‌کند)
19. DELETE_ITEM: { type, itemId, displayLabel }
20. CREATE_CATEGORY: { type, displayLabel, name }
21. CREATE_SUBSCRIPTION_PLAN: { type, displayLabel, name, period: "monthly"|"yearly", priceToman, benefits?: string[] }
22. SET_SUBSCRIPTION_PLAN_ACTIVE: { type, planId, displayLabel, active: true|false }
23. GRANT_COINS: { type, uid, displayLabel, amount } — سکه به کیف‌پول کاربر اضافه/کم می‌کند (amount می‌تواند منفی باشد برای کسر)؛ uid را فقط از لیست کاربران context پیدا کنید
24. MODERATE_REVIEW: { type, itemId, reviewId, displayLabel } — حذف یک نظر نامناسب از روی یک آیتم؛ itemId و reviewId را فقط از فهرست marketReviews موجود در context پیدا کنید

برای شناسه‌ی itemId/planId/categoryId/reviewId فقط از فهرست marketItems/subscriptionPlans/marketCategories/marketReviews داده‌شده در context استفاده کنید و هرگز حدس نزنید؛ اگر آیتم/پلن با نام گفته‌شده پیدا نشد، آن مورد را در actions نگذارید و در reply توضیح دهید.
اگر مدیر درخواست «پیشنهاد قیمت یا تخفیف بر اساس فروش» یا «چه آیتم‌هایی رو به فلان کاربر پیشنهاد بدم» یا «تحلیل خرید کاربر» داد، actions خالی بگذارید و در reply بر اساس فیلدهای salesCount و salesRevenueToman موجود در marketItems context (و در صورت وجود purchases کاربر)، پیشنهاد مشخص و مستدل بدهید (این نوع درخواست یک اکشن اجرایی نیست، فقط مشاوره است).
اگر مدیر خواست گزارش فروش کلی رو بگو، actions خالی بگذارید و در reply بر اساس marketItems یک خلاصه‌ی متنی از پرفروش‌ترین‌ها و کل درآمد بدهید.

displayLabel همیشه یک توضیح کوتاه فارسی از خودِ همان مورد است (مثلاً نام کاربر یا خلاصه‌ی پیام)، برای نمایش در چک‌لیست تاییدیه.
فقط از context دقیق داده‌شده (لیست کاربران/تیکت‌ها/broadcastها/زمان فعلی) استفاده کنید؛ چیزی نسازید و حدس نزنید.`;

  function buildAiContext(){
    const now = Date.now();
    const usersBrief = (state.users || []).slice(0, 400).map(u => {
      const bonus = (state.userXpBonusCache && state.userXpBonusCache[u.uid]) || 0;
      const coins = (state.userWalletCache && state.userWalletCache[u.uid]) || 0;
      const ban = state.bans ? state.bans[u.uid] : null;
      const isBanned = !!(ban && (!ban.until || ban.until > now));
      return {
        uid: u.uid, name: u.name || null, userId: u.userId || null,
        xp: (u.xp || 0) + bonus, adminXpBonus: bonus, coins, banned: isBanned,
        canCreateGroups: !!(state.permissions && state.permissions[u.uid]),
        canUseAi: !!(state.aiPermissions && state.aiPermissions[u.uid]),
      };
    });
    const ticketsBrief = (state.tickets || []).slice(0, 100).map(t => ({
      id: t.id, username: t.username || null, status: t.status || 'open',
      category: t.category || null, message: (t.message || '').slice(0, 200),
    }));
    const broadcastsBrief = (state.broadcasts || []).slice(0, 30).map(b => ({
      id: b.id, message: (b.message || '').slice(0, 150), sendAt: b.sendAt || null, pending: (b.sendAt || 0) > now,
    }));
    const categoriesBrief = (state.marketCategories || []).map(c => ({ id: c.id, name: c.name }));
    const itemsBrief = (state.marketItems || []).slice(0, 300).map(it => ({
      id: it.id, name: it.name, type: it.type, categoryId: it.categoryId || null,
      coinPrice: it.coinPrice || 0, cashPrice: it.cashPrice || 0, free: !!it.free,
      discount: it.discount || null, publishAt: it.publishAt || null, active: it.active !== false,
      salesCount: it.salesCount || 0, salesRevenueToman: it.salesRevenueToman || 0,
    }));
    const plansBrief = (state.marketPlans || []).map(p => ({
      id: p.id, name: p.name, period: p.period, priceToman: p.priceToman || 0, active: p.active !== false,
    }));
    const reviewsBrief = (state.marketReviewsCache || []).slice(0, 200).map(r => ({
      itemId: r.itemId, itemName: r.itemName, reviewId: r.id, userName: r.userName || null,
      rating: r.rating || 0, text: (r.text || '').slice(0, 150),
    }));
    return {
      nowTimestamp: now,
      nowReadable: new Date(now).toLocaleString('fa-IR', { dateStyle: 'full', timeStyle: 'short' }),
      appStatus: state.appStatus,
      users: usersBrief,
      tickets: ticketsBrief,
      broadcasts: broadcastsBrief,
      marketCategories: categoriesBrief,
      marketItems: itemsBrief,
      subscriptionPlans: plansBrief,
      marketReviews: reviewsBrief,
    };
  }

  async function ensureAiContextLoaded(){
    const tasks = [];
    if (!state.usersLoaded) tasks.push(renderUsersDataOnly());
    if (!state.ticketsLoaded) tasks.push(loadTicketsDataOnly());
    if (!state.broadcastsLoaded) tasks.push(loadBroadcasts());
    if (!state.appStatusLoaded) tasks.push(loadAppStatus());
    if (!state.marketLoaded) tasks.push(loadMarketData());
    if (!state.marketReviewsCache) tasks.push(loadAllMarketReviews());
    if (tasks.length) await Promise.all(tasks);
  }

  // بارگذاری همه‌ی نظرات همه‌ی آیتم‌ها (برای context دستیار هوشمند و تب «نظرات»)
  async function loadAllMarketReviews(){
    try {
      if (!state.marketLoaded) await loadMarketData();
      const itemIds = state.marketItems.map(i => i.id);
      const snaps = await Promise.all(itemIds.map(id => fbDb.ref('market/items/' + id + '/reviews').once('value')));
      const all = [];
      snaps.forEach((snap, idx) => {
        const val = snap.val();
        if (!val) return;
        const itemId = itemIds[idx];
        const item = state.marketItems.find(i => i.id === itemId);
        Object.keys(val).forEach(reviewId => {
          all.push({ id: reviewId, itemId, itemName: item ? item.name : itemId, ...val[reviewId] });
        });
      });
      state.marketReviewsCache = all;
    } catch(e) { console.error('loadAllMarketReviews error:', e); state.marketReviewsCache = []; }
  }

  // نسخه‌ی سبک از بارگذاری کاربران/تیکت‌ها بدون نیاز به وجود المان‌های DOM صفحات دیگر
  async function renderUsersDataOnly(){
    try {
      const [leaderSnap, bansSnap, permsSnap, usersSnap] = await Promise.all([
        fbDb.ref('leaderboard').once('value'),
        fbDb.ref('bans').once('value'),
        fbDb.ref('permissions').once('value'),
        fbDb.ref('users').once('value'),
      ]);
      const leaderVal = leaderSnap.val() || {};
      const usersVal = usersSnap.val() || {};
      state.bans = bansSnap.val() || {};
      state.permissions = {}; state.aiPermissions = {}; state.userIdMaxChangesCache = {};
      const permsVal = permsSnap.val() || {};
      Object.keys(permsVal).forEach(uid => {
        state.permissions[uid] = !!(permsVal[uid] && permsVal[uid].canCreateGroups);
        state.aiPermissions[uid] = !!(permsVal[uid] && permsVal[uid].canUseAi);
        if (permsVal[uid] && typeof permsVal[uid].userIdMaxChanges === 'number') {
          state.userIdMaxChangesCache[uid] = permsVal[uid].userIdMaxChanges;
        }
      });
      state.userXpBonusCache = {};
      state.userWalletCache = {};
      Object.keys(usersVal).forEach(uid => {
        state.userXpBonusCache[uid] = usersVal[uid].adminXpBonus || 0;
        state.userWalletCache[uid] = (usersVal[uid].wallet && usersVal[uid].wallet.coins) || 0;
      });
      state.users = Object.keys(leaderVal).map(uid => ({ uid, ...leaderVal[uid] })).sort((a,b) => (b.xp||0) - (a.xp||0));
      state.usersLoaded = true;
    } catch(e) { console.error('renderUsersDataOnly error:', e); state.users = []; }
  }

  async function loadTicketsDataOnly(){
    try {
      const snap = await fbDb.ref('supportTickets').orderByChild('createdAt').limitToLast(300).once('value');
      const val = snap.val() || {};
      state.tickets = Object.keys(val).map(id => ({ id, ...val[id] })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      state.ticketsLoaded = true;
    } catch(e) { console.error('loadTicketsDataOnly error:', e); state.tickets = []; }
  }

  async function loadAppStatus(){
    try {
      const snap = await fbDb.ref('appStatus').once('value');
      const val = snap.val() || {};
      state.appStatus = { closed: !!val.closed, message: val.message || DEFAULT_MAINTENANCE_MSG };
      state.appStatusLoaded = true;
    } catch(e) {
      state.appStatus = { closed: false, message: DEFAULT_MAINTENANCE_MSG };
    }
  }

  async function renderAssistant(){
    const main = document.getElementById('mainArea');
    main.innerHTML = `
      <div class="page-head">
        <h2>${icon('sparkles',16)} دستیار هوشمند</h2>
        <p>دستور بده به زبان فارسی؛ دستیار عملیات رو تشخیص می‌ده و بعد از تاییدت اجرا می‌کنه</p>
      </div>
      <div id="aiAssistantBody"></div>
    `;
    await ensureAiContextLoaded();
    if (!state.aiConfigLoaded) await loadAiConfig();
    paintAssistantBody();
  }

  function paintAssistantBody(){
    const body = document.getElementById('aiAssistantBody');
    if (!body) return;
    const hasKey = !!(state.aiConfigKeys && state.aiConfigKeys.length);
    if (!hasKey) {
      body.innerHTML = `
        <div class="card ai-no-key">
          ${icon('sparkles', 40)}
          <p>هنوز کلید Gemini توی «اطلاع‌رسانی و وضعیت برنامه» ذخیره نشده.<br>برای فعال‌سازی دستیار، اول یک کلید API معتبر ذخیره کن.</p>
        </div>
      `;
      return;
    }
    body.innerHTML = `
      <div class="card ai-chat-wrap" style="padding:16px">
        <div class="ai-chat-log" id="aiChatLog"></div>
        <div class="ai-chat-inputbar">
          <textarea class="ta" id="aiChatInput" placeholder="مثلاً: کاربر علی رو ۷ روز به‌خاطر فحاشی مسدود کن" rows="1"></textarea>
          <button class="ai-send-btn" id="aiChatSendBtn" title="ارسال">${icon('send',18)}</button>
        </div>
      </div>
    `;
    const log = document.getElementById('aiChatLog');
    const input = document.getElementById('aiChatInput');
    const sendBtn = document.getElementById('aiChatSendBtn');

    function paintLog(){
      log.innerHTML = state.aiChat.messages.map((m, idx) => {
        if (m.role === 'user') return `<div class="ai-msg user">${esc(m.text)}</div>`;
        if (m.role === 'error') return `<div class="ai-msg bot err">${esc(m.text)}</div>`;
        if (m.role === 'typing') return `<div class="ai-msg bot"><span class="ai-typing"><span></span><span></span><span></span></span></div>`;
        if (m.role === 'actions') return renderActionCard(m, idx);
        return `<div class="ai-msg bot">${esc(m.text)}</div>`;
      }).join('');
      log.scrollTop = log.scrollHeight;
    }

    function renderActionCard(m, idx){
      if (m.executed) {
        return `
          <div class="ai-action-card">
            <div class="aic-summary">${esc(m.text)}</div>
            ${m.actions.map((a, i) => `
              <div class="ai-action-item ${a.__error ? 'aic-failed' : ''}">
                <span class="aic-num">${faNum(i+1)}</span>
                <span class="aic-target">${esc(a.displayLabel || a.uid || a.ticketId || '')}</span>
                <span class="aic-detail">${esc(actionTypeFa(a.type))}</span>
                <span class="aic-status">${a.__error ? icon('ban',14) : icon('check',14)}</span>
              </div>
            `).join('')}
            <div style="margin-top:10px;font-size:11.5px;color:var(--muted)">${m.hasError ? 'برخی موارد با خطا مواجه شدند.' : 'همه‌ی موارد با موفقیت اجرا شدند.'}</div>
          </div>
        `;
      }
      return `
        <div class="ai-action-card">
          <div class="aic-summary">${esc(m.text)}</div>
          ${m.actions.map((a, i) => `
            <div class="ai-action-item">
              <span class="aic-num">${faNum(i+1)}</span>
              <span class="aic-target">${esc(a.displayLabel || a.uid || a.ticketId || '')}</span>
              <span class="aic-detail">${esc(actionTypeFa(a.type))}</span>
            </div>
          `).join('')}
          <div class="ai-actions-footer">
            <button class="btn-secondary" onclick="__admin.cancelAiActions(${idx})">انصراف</button>
            <button class="btn-confirm" onclick="__admin.confirmAiActions(${idx})">تایید و اجرا (${faNum(m.actions.length)} مورد)</button>
          </div>
        </div>
      `;
    }
    window.__aiPaintLog = paintLog;

    function autoGrow(){
      input.style.height = 'auto';
      input.style.height = Math.min(130, input.scrollHeight) + 'px';
    }
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
    sendBtn.addEventListener('click', handleSend);

    async function handleSend(){
      const text = input.value.trim();
      if (!text || state.aiChat.busy) return;
      input.value = '';
      autoGrow();
      state.aiChat.messages.push({ role: 'user', text });
      state.aiChat.messages.push({ role: 'typing' });
      state.aiChat.busy = true;
      sendBtn.disabled = true;
      paintLog();
      try {
        const result = await callAiAssistant(text);
        state.aiChat.messages.pop(); // remove typing
        if (result.actions && result.actions.length > 0) {
          state.aiChat.messages.push({ role: 'actions', text: result.reply, actions: result.actions, executed: false });
        } else {
          state.aiChat.messages.push({ role: 'bot', text: result.reply || 'متوجه نشدم، می‌شه واضح‌تر بگی؟' });
        }
      } catch(e) {
        console.error('AI assistant error:', e);
        state.aiChat.messages.pop(); // remove typing
        state.aiChat.messages.push({ role: 'error', text: 'خطا در ارتباط با دستیار: ' + (e && e.message ? e.message : 'نامشخص') });
      }
      state.aiChat.busy = false;
      sendBtn.disabled = false;
      paintLog();
    }

    paintLog();
  }

  function actionTypeFa(type){
    const map = {
      BAN_USER: 'مسدودسازی', UNBAN_USER: 'رفع مسدودی', UPDATE_USER_PERMISSIONS: 'تغییر مجوز',
      GRANT_XP_BONUS: 'امتیاز جایزه', UPDATE_USER_NAME: 'تغییر نام', REPLY_TICKET: 'پاسخ تیکت',
      SET_TICKET_STATUS: 'تغییر وضعیت تیکت', DELETE_TICKET: 'حذف تیکت', CREATE_BROADCAST: 'نوتیفیکیشن جدید',
      CANCEL_BROADCAST: 'لغو نوتیفیکیشن', SET_APP_STATUS: 'وضعیت برنامه',
      UPDATE_ITEM_PRICE: 'تغییر قیمت آیتم', APPLY_DISCOUNT: 'اعمال تخفیف', REMOVE_DISCOUNT: 'حذف تخفیف',
      SCHEDULE_ITEM_PUBLISH: 'زمان‌بندی انتشار', SET_ITEM_ACTIVE: 'تغییر وضعیت نمایش', SET_ITEM_FREE: 'تغییر رایگان‌بودن',
      CREATE_ITEM: 'ساخت آیتم جدید', DELETE_ITEM: 'حذف آیتم', CREATE_CATEGORY: 'ساخت دسته جدید',
      CREATE_SUBSCRIPTION_PLAN: 'ساخت پلن اشتراک', SET_SUBSCRIPTION_PLAN_ACTIVE: 'تغییر وضعیت پلن',
      GRANT_COINS: 'تغییر موجودی سکه', MODERATE_REVIEW: 'حذف نظر',
    };
    return map[type] || type;
  }

  // لیست مدل‌های فعلیِ Gemini که هنوز از رده خارج نشدن و رایگان‌ان (Flash / Flash-Lite)؛ باید دقیقاً
  // با همین لیست توی index.html یکی باشه چون هر دو از یک aiConfig/geminiModel می‌خونن.
  const DEFAULT_GEMINI_MODEL = 'gemini-3.6-flash';
  const AVAILABLE_GEMINI_MODELS = [
    'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3-flash',
    'gemini-3.1-flash-lite', 'gemini-2.5-flash', 'gemini-2.5-flash-lite',
  ];
  function geminiEndpointFor(model){
    const m = AVAILABLE_GEMINI_MODELS.includes(model) ? model : DEFAULT_GEMINI_MODEL;
    return `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`;
  }
  // چرخش بین چند کلید Gemini (aiConfig/geminiKeys) با یک شمارنده‌ی مشترک توی فایربیس؛ همون منطقِ
  // index.html، چون این پنل هم از همون استخر کلید مشترک استفاده می‌کنه (نگاه کن به index.html
  // برای توضیح کامل و نکته‌ی امنیتیِ لازم توی Realtime Database Rules).
  async function pickNextGeminiKey(keys){
    if (!keys || !keys.length) return '';
    if (keys.length === 1) return keys[0];
    try {
      const idxRef = fbDb.ref('aiConfig/geminiKeyRotationIndex');
      const txResult = await idxRef.transaction((cur) => (((typeof cur === 'number' ? cur : 0) + 1) % 1000000));
      const idx = (txResult && txResult.committed && txResult.snapshot && typeof txResult.snapshot.val() === 'number')
        ? txResult.snapshot.val() : Math.floor(Math.random() * keys.length);
      return keys[idx % keys.length];
    } catch(e){
      return keys[Math.floor(Math.random() * keys.length)];
    }
  }

  async function callAiAssistant(userText){
    if (!state.aiConfigKeys || !state.aiConfigKeys.length) throw new Error('کلید Gemini تنظیم نشده');
    const key = await pickNextGeminiKey(state.aiConfigKeys);
    const model = state.aiConfigModel || DEFAULT_GEMINI_MODEL;
    const context = buildAiContext();
    const history = state.aiChat.messages
      .filter(m => m.role === 'user' || m.role === 'bot' || m.role === 'actions')
      .slice(-10)
      .map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.role === 'user' ? m.text : JSON.stringify({ reply: m.text, actions: m.actions || [] }) }],
      }));
    const contents = [
      ...history,
      { role: 'user', parts: [{ text: 'اطلاعات فعلی سیستم (context):\n' + JSON.stringify(context) + '\n\nدستور مدیر:\n' + userText }] },
    ];
    let res;
    try {
      res = await fetch(geminiEndpointFor(model), {
        method: 'POST',
        headers: {
          'x-goog-api-key': key,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: AI_ASSISTANT_SYSTEM_PROMPT }] },
          contents,
          generationConfig: { responseMimeType: 'application/json', temperature: 0.2 },
        }),
      });
    } catch(e) {
      throw new Error('اتصال به سرویس هوش مصنوعی برقرار نشد');
    }
    if (!res.ok) {
      let msg = 'پاسخ ناموفق از سرویس هوش مصنوعی (کد ' + res.status + ')';
      if (res.status === 401 || res.status === 403) msg = 'کلید Gemini نامعتبره یا دسترسی نداره';
      else if (res.status === 429) msg = 'محدودیت نرخ درخواست (Rate limit) — چند لحظه صبر کن و دوباره امتحان کن';
      try {
        const errBody = await res.json();
        if (errBody && errBody.error && errBody.error.message) msg = errBody.error.message;
      } catch(e){}
      throw new Error(msg);
    }
    const data = await res.json();
    const textOut = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
    if (!textOut) throw new Error('پاسخ خالی از سرویس هوش مصنوعی');
    let parsed;
    try { parsed = JSON.parse(textOut); } catch(e) { throw new Error('خروجی دستیار قابل تفسیر نبود'); }
    const reply = (parsed && parsed.reply) || '';
    let actions = Array.isArray(parsed && parsed.actions) ? parsed.actions : [];
    // فقط اکشن‌هایی که uid/ticketId معتبرشون توی context واقعاً وجود داره رو نگه می‌داریم (ضدِ هالوسینیشن)
    const validUids = new Set(context.users.map(u => u.uid));
    const validTicketIds = new Set(context.tickets.map(t => t.id));
    const validBroadcastIds = new Set(context.broadcasts.map(b => b.id));
    const validItemIds = new Set(context.marketItems.map(i => i.id));
    const validPlanIds = new Set(context.subscriptionPlans.map(p => p.id));
    actions = actions.filter(a => {
      if (!a || !a.type) return false;
      if (['BAN_USER','UNBAN_USER','UPDATE_USER_PERMISSIONS','GRANT_XP_BONUS','UPDATE_USER_NAME'].includes(a.type)) return validUids.has(a.uid);
      if (['REPLY_TICKET','SET_TICKET_STATUS','DELETE_TICKET'].includes(a.type)) return validTicketIds.has(a.ticketId);
      if (a.type === 'CANCEL_BROADCAST') return validBroadcastIds.has(a.broadcastId);
      if (a.type === 'CREATE_BROADCAST' || a.type === 'SET_APP_STATUS') return true;
      if (['UPDATE_ITEM_PRICE','APPLY_DISCOUNT','REMOVE_DISCOUNT','SCHEDULE_ITEM_PUBLISH','SET_ITEM_ACTIVE','SET_ITEM_FREE','DELETE_ITEM'].includes(a.type)) return validItemIds.has(a.itemId);
      if (a.type === 'CREATE_ITEM' || a.type === 'CREATE_CATEGORY' || a.type === 'CREATE_SUBSCRIPTION_PLAN') return true;
      if (a.type === 'SET_SUBSCRIPTION_PLAN_ACTIVE') return validPlanIds.has(a.planId);
      return false;
    });
    return { reply, actions };
  }

  async function cancelAiActions(idx){
    const m = state.aiChat.messages[idx];
    if (!m) return;
    state.aiChat.messages[idx] = { role: 'bot', text: 'باشه، لغو شد. اگه چیز دیگه‌ای لازم داری بگو.' };
    if (window.__aiPaintLog) window.__aiPaintLog();
  }

  async function confirmAiActions(idx){
    const m = state.aiChat.messages[idx];
    if (!m || m.executed) return;
    for (const a of m.actions) {
      try {
        await executeAiAction(a);
      } catch(e) {
        console.error('executeAiAction error:', a, e);
        a.__error = true;
      }
    }
    m.executed = true;
    m.hasError = m.actions.some(a => a.__error);
    toast(m.hasError ? 'برخی عملیات با خطا مواجه شدند' : 'همه‌ی عملیات با موفقیت اجرا شد', m.hasError ? 'err' : 'ok');
    if (window.__aiPaintLog) window.__aiPaintLog();
    // رفرش کش‌های محلی مرتبط تا صفحات دیگه هم به‌روز باشن
    state.usersLoaded = false; state.ticketsLoaded = false; state.broadcastsLoaded = false; state.appStatusLoaded = false; state.marketLoaded = false;
  }

  async function executeAiAction(a){
    switch (a.type) {
      case 'BAN_USER': {
        const type = a.banType || 'permanent';
        const until = type === 'permanent' ? null : Date.now() + (parseInt(type, 10) || 0) * 86400000;
        await fbDb.ref('bans/' + a.uid).set({ until, reason: a.reason || null, bannedAt: Date.now() });
        state.bans[a.uid] = { until, reason: a.reason || null, bannedAt: Date.now() };
        return;
      }
      case 'UNBAN_USER': {
        await fbDb.ref('bans/' + a.uid).remove();
        delete state.bans[a.uid];
        return;
      }
      case 'UPDATE_USER_PERMISSIONS': {
        const updates = {};
        if (typeof a.canCreateGroups === 'boolean') updates.canCreateGroups = a.canCreateGroups;
        if (typeof a.canUseAi === 'boolean') updates.canUseAi = a.canUseAi;
        if (typeof a.userIdMaxChanges === 'number') updates.userIdMaxChanges = a.userIdMaxChanges;
        if (Object.keys(updates).length) await fbDb.ref('permissions/' + a.uid).update(updates);
        return;
      }
      case 'GRANT_XP_BONUS': {
        const amount = typeof a.amount === 'number' ? a.amount : parseInt(a.amount, 10) || 0;
        await fbDb.ref('users/' + a.uid + '/adminXpBonus').set(amount);
        if (!state.userXpBonusCache) state.userXpBonusCache = {};
        state.userXpBonusCache[a.uid] = amount;
        return;
      }
      case 'UPDATE_USER_NAME': {
        if (!a.newName) return;
        await fbDb.ref('leaderboard/' + a.uid).update({ name: a.newName });
        return;
      }
      case 'REPLY_TICKET': {
        if (!a.replyText) return;
        await fbDb.ref('supportTickets/' + a.ticketId).update({ adminReply: a.replyText, status: 'answered', updatedAt: Date.now() });
        return;
      }
      case 'SET_TICKET_STATUS': {
        await fbDb.ref('supportTickets/' + a.ticketId).update({ status: a.status, updatedAt: Date.now() });
        return;
      }
      case 'DELETE_TICKET': {
        await fbDb.ref('supportTickets/' + a.ticketId).remove();
        return;
      }
      case 'CREATE_BROADCAST': {
        const sendAt = typeof a.sendAtTimestamp === 'number' ? a.sendAtTimestamp : Date.now();
        const ref = fbDb.ref('broadcastNotifications').push();
        await ref.set({ message: a.message || '', createdAt: Date.now(), sendAt, createdBy: state.email || state.uid || null });
        return;
      }
      case 'CANCEL_BROADCAST': {
        await fbDb.ref('broadcastNotifications/' + a.broadcastId).remove();
        return;
      }
      case 'SET_APP_STATUS': {
        await fbDb.ref('appStatus').set({ closed: !!a.closed, message: a.message || DEFAULT_MAINTENANCE_MSG, updatedAt: Date.now() });
        state.appStatus = { closed: !!a.closed, message: a.message || DEFAULT_MAINTENANCE_MSG };
        return;
      }
      case 'UPDATE_ITEM_PRICE': {
        const updates = { updatedAt: Date.now() };
        if (typeof a.coinPrice === 'number') updates.coinPrice = a.coinPrice;
        if (typeof a.cashPrice === 'number') updates.cashPrice = a.cashPrice;
        await fbDb.ref('market/items/' + a.itemId).update(updates);
        return;
      }
      case 'APPLY_DISCOUNT': {
        const discount = {
          active: true,
          kind: a.kind === 'amount' ? 'amount' : 'percent',
          value: typeof a.value === 'number' ? a.value : parseFloat(a.value) || 0,
          startAt: typeof a.startAtTimestamp === 'number' ? a.startAtTimestamp : Date.now(),
          endAt: typeof a.endAtTimestamp === 'number' ? a.endAtTimestamp : null,
        };
        await fbDb.ref('market/items/' + a.itemId).update({ discount, updatedAt: Date.now() });
        return;
      }
      case 'REMOVE_DISCOUNT': {
        await fbDb.ref('market/items/' + a.itemId + '/discount').remove();
        return;
      }
      case 'SCHEDULE_ITEM_PUBLISH': {
        const publishAt = typeof a.publishAtTimestamp === 'number' ? a.publishAtTimestamp : Date.now();
        await fbDb.ref('market/items/' + a.itemId).update({ publishAt, published: true, updatedAt: Date.now() });
        return;
      }
      case 'SET_ITEM_ACTIVE': {
        await fbDb.ref('market/items/' + a.itemId).update({ active: !!a.active, updatedAt: Date.now() });
        return;
      }
      case 'SET_ITEM_FREE': {
        await fbDb.ref('market/items/' + a.itemId).update({ free: !!a.free, updatedAt: Date.now() });
        return;
      }
      case 'CREATE_ITEM': {
        const ref = fbDb.ref('market/items').push();
        await ref.set({
          name: a.name || 'آیتم بدون نام', description: a.description || '', type: a.itemType || 'other',
          categoryId: a.categoryId || null, tags: {}, fileUrl: '', fileName: '', previewUrls: [],
          coinPrice: typeof a.coinPrice === 'number' ? a.coinPrice : 0,
          cashPrice: typeof a.cashPrice === 'number' ? a.cashPrice : 0,
          free: !!a.free, discount: null, publishAt: null, published: false, active: true,
          createdAt: Date.now(), updatedAt: Date.now(),
        });
        return;
      }
      case 'DELETE_ITEM': {
        await fbDb.ref('market/items/' + a.itemId).remove();
        return;
      }
      case 'CREATE_CATEGORY': {
        const ref = fbDb.ref('market/categories').push();
        await ref.set({ name: a.name || 'دسته جدید', order: (state.marketCategories || []).length, createdAt: Date.now() });
        return;
      }
      case 'CREATE_SUBSCRIPTION_PLAN': {
        const ref = fbDb.ref('market/subscriptionPlans').push();
        await ref.set({
          name: a.name || 'پلن جدید', period: a.period === 'yearly' ? 'yearly' : 'monthly',
          priceToman: typeof a.priceToman === 'number' ? a.priceToman : 0,
          benefits: Array.isArray(a.benefits) ? a.benefits : [],
          active: true, order: (state.marketPlans || []).length, createdAt: Date.now(),
        });
        return;
      }
      case 'SET_SUBSCRIPTION_PLAN_ACTIVE': {
        await fbDb.ref('market/subscriptionPlans/' + a.planId).update({ active: !!a.active });
        return;
      }
      case 'GRANT_COINS': {
        const amount = typeof a.amount === 'number' ? a.amount : parseInt(a.amount, 10) || 0;
        const ref = fbDb.ref('users/' + a.uid + '/wallet/coins');
        const res = await ref.transaction((cur) => Math.max(0, (cur || 0) + amount));
        const newBal = res.snapshot ? res.snapshot.val() : null;
        await fbDb.ref('users/' + a.uid + '/wallet/lastUpdated').set(Date.now());
        await fbDb.ref('users/' + a.uid + '/walletHistory').push({
          type: amount >= 0 ? 'earn' : 'spend', amount, reason: 'admin_ai_grant', at: Date.now(),
        });
        if (!state.userWalletCache) state.userWalletCache = {};
        if (newBal != null) state.userWalletCache[a.uid] = newBal;
        return;
      }
      case 'MODERATE_REVIEW': {
        await fbDb.ref('market/items/' + a.itemId + '/reviews/' + a.reviewId).remove();
        if (state.marketReviewsCache) {
          state.marketReviewsCache = state.marketReviewsCache.filter(r => !(r.itemId === a.itemId && r.id === a.reviewId));
        }
        return;
      }
      default:
        throw new Error('نوع اکشن ناشناخته: ' + a.type);
    }
  }

  window.__admin = { navigate, openReplyModal, setTicketStatus, deleteTicket, openEditUserModal, openBanModal, openWordModal, deleteWord, saveAppStatus, sendBroadcast, cancelBroadcast, deleteBroadcast, confirmAiActions, cancelAiActions,
    openItemModal, deleteMarketItem, openCategoryModal, deleteMarketCategory, deleteMarketTag, openPlanModal, deleteMarketPlan, deleteMarketReview,
    toggleMarketDiscount, deleteMarketDiscount };

  async function loadContentWords(){
    const wrap = document.getElementById('wordListWrap');
    if (wrap) wrap.innerHTML = `<div class="empty-state"><span class="loading-spin"></span></div>`;
    if (state.contentLang !== 'de') {
      if (wrap) wrap.innerHTML = `<div class="empty-state">${icon('content',46)}<p>محتوای کلمات فعلاً فقط برای آلمانی موجود است.</p></div>`;
      return;
    }
    try {
      const file = CURRICULUM_FILES[state.contentLevel];
      const [res, overridesSnap] = await Promise.all([
        fetch(file),
        fbDb.ref('contentOverrides/' + state.contentLang + '/' + state.contentLevel).once('value'),
      ]);
      const base = res.ok ? await res.json() : [];
      const overrides = overridesSnap.val() || null;
      state.contentOverrides = overrides;
      state.contentWords = applyOverrides(Array.isArray(base) ? base : [], overrides);
      paintWordList();
    } catch(e) {
      console.error('loadContentWords error:', e);
      toast('خطا در بارگذاری کلمات: ' + (e && e.message ? e.message : 'نامشخص'), 'err');
      const wrap2 = document.getElementById('wordListWrap');
      if (wrap2) wrap2.innerHTML = `<div class="empty-state">${icon('content',46)}<p>خطا در بارگذاری فایل کلمات.</p></div>`;
    }
  }

  function applyOverrides(baseWords, overrides){
    if (!overrides) return baseWords;
    let words = baseWords.slice();
    const deletes = new Set(overrides.deletes || []);
    if (deletes.size) words = words.filter(w => !deletes.has(String(w.id)));
    if (overrides.edits) words = words.map(w => (overrides.edits[String(w.id)] ? { ...w, ...overrides.edits[String(w.id)] } : w));
    if (Array.isArray(overrides.adds) && overrides.adds.length) words = words.concat(overrides.adds);
    return words;
  }

  async function deleteWord(wordId){
    if (!confirm('این کلمه حذف شود؟')) return;
    try {
      const basePath = 'contentOverrides/' + state.contentLang + '/' + state.contentLevel;
      const deletesRef = fbDb.ref(basePath + '/deletes');
      const snap = await deletesRef.once('value');
      const deletes = snap.val() || [];
      if (!deletes.includes(wordId)) deletes.push(wordId);
      await deletesRef.set(deletes);
      toast('کلمه حذف شد', 'ok');
      state.contentWords = [];
      loadContentWords();
    } catch(e) { toast('خطا در حذف', 'err'); }
  }

  // ===================== مارکت (فروشگاه آیتم‌ها + اشتراک) =====================
  // ساختار داده در Realtime Database:
  //   market/categories/{catId}   -> { name, order, createdAt }
  //   market/tags/{tagId}         -> { name, createdAt }
  //   market/items/{itemId}       -> {
  //     name, description, type, categoryId, tags: {tagId:true,...},
  //     fileUrl, fileName, previewUrls: [url,...],
  //     coinPrice, cashPrice, free,
  //     discount: { active, kind:'percent'|'amount', value, startAt, endAt } | null,
  //     publishAt, published, active,
  //     salesCount, salesRevenueToman,   // فقط خواندنی؛ توسط اپ اصلی موقع خرید به‌روزرسانی می‌شن
  //     createdAt, updatedAt
  //   }
  //   market/subscriptionPlans/{planId} -> { name, period:'monthly'|'yearly', priceToman, benefits:[...], active, order, createdAt }
  const MARKET_ITEM_TYPES = [
    { id: 'theme', label: 'تم' },
    { id: 'frame', label: 'قاب پروفایل' },
    { id: 'decoration', label: 'آیتم تزئینی' },
    { id: 'badge', label: 'نشان' },
    { id: 'wordPack', label: '📚 بسته کلمات' },
    { id: 'coinPack', label: '🪙 بسته سکه' },
    { id: 'other', label: 'سایر' },
  ];
  const MARKET_TABS = [
    { id: 'items', label: 'آیتم‌ها', icon: 'market' },
    { id: 'categories', label: 'دسته‌بندی‌ها', icon: 'content' },
    { id: 'tags', label: 'برچسب‌ها', icon: 'tag' },
    { id: 'subscriptions', label: 'اشتراک', icon: 'crown' },
    { id: 'discounts', label: 'کد تخفیف', icon: 'percent' },
    { id: 'reviews', label: 'نظرات', icon: 'star' },
    { id: 'report', label: 'گزارش فروش', icon: 'dashboard' },
  ];

  function itemTypeFa(t){ return (MARKET_ITEM_TYPES.find(x => x.id === t) || {}).label || 'سایر'; }

  function isDiscountLive(d, now){
    now = now || Date.now();
    if (!d || !d.active) return false;
    if (d.startAt && now < d.startAt) return false;
    if (d.endAt && now > d.endAt) return false;
    return true;
  }
  function effectivePrice(item, priceField, now){
    const base = item[priceField] || 0;
    if (!base || item.free) return 0;
    const d = item.discount;
    if (!isDiscountLive(d, now)) return base;
    if (d.kind === 'percent') return Math.max(0, Math.round(base - (base * (d.value || 0) / 100)));
    return Math.max(0, Math.round(base - (d.value || 0)));
  }
  function isPublished(item, now){
    now = now || Date.now();
    if (item.active === false) return false;
    if (!item.publishAt) return !!item.published;
    return item.publishAt <= now;
  }

  async function loadMarketData(force){
    if (state.marketLoaded && !force) return;
    try {
      const [catSnap, tagSnap, itemSnap, planSnap, discSnap] = await Promise.all([
        fbDb.ref('market/categories').once('value'),
        fbDb.ref('market/tags').once('value'),
        fbDb.ref('market/items').once('value'),
        fbDb.ref('market/subscriptionPlans').once('value'),
        fbDb.ref('market/discountCodes').once('value'),
      ]);
      const catVal = catSnap.val() || {};
      const tagVal = tagSnap.val() || {};
      const itemVal = itemSnap.val() || {};
      const planVal = planSnap.val() || {};
      const discVal = discSnap.val() || {};
      state.marketCategories = Object.keys(catVal).map(id => ({ id, ...catVal[id] })).sort((a,b) => (a.order||0)-(b.order||0));
      state.marketTags = Object.keys(tagVal).map(id => ({ id, ...tagVal[id] }));
      state.marketItems = Object.keys(itemVal).map(id => ({ id, ...itemVal[id] })).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
      state.marketPlans = Object.keys(planVal).map(id => ({ id, ...planVal[id] })).sort((a,b) => (a.order||0)-(b.order||0));
      state.marketDiscountCodes = Object.keys(discVal).map(code => ({ code, ...discVal[code] })).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
      state.marketLoaded = true;
    } catch(e) {
      console.error('loadMarketData error:', e);
      toast('خطا در بارگذاری اطلاعات مارکت', 'err');
    }
  }

  // آپلود فایل‌های مارکت (فایل اصلی آیتم + تصاویر پیش‌نمایش) روی Cloudinary، دقیقاً با همون
  // Cloud Name/Upload Preset که برای رسانه‌ی چت توی index.html استفاده می‌شه. از اندپوینت
  // «auto» استفاده می‌کنیم چون فایل اصلی آیتم لزوماً عکس نیست (می‌تونه هر نوع فایلی باشه)،
  // در حالی که تصاویر پیش‌نمایش همیشه عکسن؛ auto هر دو حالت رو درست تشخیص می‌ده.
  const CLOUDINARY_CLOUD_NAME = 'crk0ggty';
  const CLOUDINARY_UPLOAD_PRESET = 'leitner_preset';
  async function uploadMarketFile(file, itemId, kind){
    const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const controller = new AbortController();
    // اگه آپلود بیشتر از ۴۵ ثانیه طول بکشه (مثلاً به‌خاطر قطعی شبکه)، به‌جای گیرکردن ابدیِ
    // دکمه‌ی ذخیره، خطا می‌ده تا کاربر بتونه دوباره امتحان کنه.
    const timeoutId = setTimeout(() => controller.abort(), 45000);
    let res;
    try {
      res = await fetch(endpoint, { method: 'POST', body: formData, signal: controller.signal });
    } catch(e){
      if (e && e.name === 'AbortError') throw new Error('آپلود فایل بیش از حد طول کشید (تایم‌اوت). دوباره امتحان کن.');
      throw new Error('اتصال به سرور آپلود برقرار نشد: ' + (e && e.message ? e.message : e));
    } finally {
      clearTimeout(timeoutId);
    }
    if (!res.ok){
      let detail = '';
      try { const errBody = await res.json(); detail = (errBody && errBody.error && errBody.error.message) || ''; } catch(e){}
      throw new Error('Cloudinary upload failed: ' + res.status + (detail ? ' — ' + detail : ''));
    }
    const data = await res.json();
    if (!data || !data.secure_url) throw new Error('Cloudinary upload: no secure_url in response');
    return data.secure_url;
  }

  function openItemModal(itemId){
    const isNew = !itemId;
    const it = isNew ? {
      name: '', description: '', type: 'theme', categoryId: '', tags: {},
      fileUrl: '', fileName: '', previewUrls: [],
      coinPrice: 0, cashPrice: 0, free: false,
      discount: null, publishAt: null, active: true,
    } : state.marketItems.find(x => x.id === itemId);
    if (!it) return;
    const draftId = itemId || ('new-' + Date.now());
    const pendingFiles = { mainFile: null, previewFiles: [] };
    const catOptions = state.marketCategories.map(c => `<option value="${c.id}" ${it.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    const typeOptions = MARKET_ITEM_TYPES.map(t => `<option value="${t.id}" ${it.type===t.id?'selected':''}>${t.label}</option>`).join('');
    const d = it.discount || { kind: 'percent', value: 0, startAt: null, endAt: null, active: false };
    const toLocalInput = (ts) => ts ? new Date(ts - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';

          <div><label class="mlabel">نوع</label><select class="mfield" id="itType">${typeOptions}</select></div>
        </div>
        <div class="mfield-group"><label class="mlabel">توضیحات</label><textarea class="mfield ta" id="itDesc" rows="2">${esc(it.description||'')}</textarea></div>

              <select class="mfield" id="itWordPackLang">
                <option value="">— برای همه‌ی زبان‌ها —</option>
                ${LANGUAGE_CODES.map(c => `<option value="${c}" ${it.langCode===c?'selected':''}>${LANGUAGE_META[c].flag} ${LANGUAGE_META[c].native}</option>`).join('')}

Danke - ممنون
Wie geht's? - حالت چطوره؟ (sentence)" style="direction:ltr;text-align:left;font-family:monospace;font-size:12.5px">${(it.payload && it.payload.words) ? it.payload.words.map(w => w.de + ' - ' + w.fa + (w.type==='sentence' ? ' (sentence)' : '')).join('\n') : ''}</textarea>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">هر خط: «کلمه - معنی». اگه جمله‌ست، آخر خط بنویس (sentence) تا به‌جای کلمه، به‌عنوان جمله اضافه بشه.</div>

          <input class="mfield" id="itCoinPackAmount" type="number" min="1" value="${(it.payload && it.payload.coins) || 0}">

          <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap" id="itPreviewCur">

          <span style="font-size:13px;display:flex;align-items:center;gap:6px">${icon('percent',13)} تخفیف فعال</span>

            <select class="mfield" id="itDiscKind">

              <option value="amount" ${d.kind==='amount'?'selected':''}>مبلغ ثابت (تومان)</option>
            </select>
          </div>
          <div><label class="mlabel">مقدار تخفیف</label><input class="mfield" id="itDiscValue" type="number" min="0" value="${d.value||0}"></div>
        </div>
        <div class="mfield-row mfield-group">
          <div><label class="mlabel">شروع تخفیف</label><input class="mfield" id="itDiscStart" type="datetime-local" value="${toLocalInput(d.startAt)}"></div>
          <div><label class="mlabel">پایان تخفیف</label><input class="mfield" id="itDiscEnd" type="datetime-local" value="${toLocalInput(d.endAt)}"></div>
        </div>

        <div class="mfield-group" style="border-top:1px solid var(--border2);padding-top:12px">

          <label style="position:relative;display:inline-block;width:40px;height:22px">
            <input type="checkbox" id="itActive" ${it.active!==false?'checked':''} style="opacity:0;width:0;height:0">
            <span id="itActiveTrack" style="position:absolute;inset:0;background:${it.active!==false?'var(--sage-strong)':'var(--border2)'};border-radius:20px;transition:0.15s;cursor:pointer"></span>
          </label>
        </div>

        <div class="modal-actions">
          <button class="btn-secondary" id="itCancelBtn">انصراف</button>
          <button class="btn-confirm" id="itSaveBtn">ذخیره</button>

    `;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#itCancelBtn').addEventListener('click', () => backdrop.remove());
    [['itFree','itFreeTrack'],['itDiscActive','itDiscTrack'],['itActive','itActiveTrack']].forEach(([cb, tr]) => {
      const c = backdrop.querySelector('#'+cb), t = backdrop.querySelector('#'+tr);
      c.addEventListener('change', () => { t.style.background = c.checked ? 'var(--sage-strong)' : 'var(--border2)'; });
    });
    backdrop.querySelector('#itMainFile').addEventListener('change', (e) => { pendingFiles.mainFile = e.target.files[0] || null; });
    backdrop.querySelector('#itPreviewFiles').addEventListener('change', (e) => { pendingFiles.previewFiles = Array.from(e.target.files || []); });
    const syncTypeFields = () => {
      const ty = backdrop.querySelector('#itType').value;
      backdrop.querySelector('#itWordPackFields').style.display = ty === 'wordPack' ? '' : 'none';
      backdrop.querySelector('#itCoinPackFields').style.display = ty === 'coinPack' ? '' : 'none';
    };
    backdrop.querySelector('#itType').addEventListener('change', syncTypeFields);
    syncTypeFields();

    backdrop.querySelector('#itSaveBtn').addEventListener('click', async () => {
      const name = backdrop.querySelector('#itName').value.trim();
      if (!name) { toast('نام آیتم الزامی است', 'err'); return; }
      const saveBtn = backdrop.querySelector('#itSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'در حال ذخیره...';
      try {
        const targetId = isNew ? fbDb.ref('market/items').push().key : itemId;
        let fileUrl = it.fileUrl || '', fileName = it.fileName || '';
        if (pendingFiles.mainFile) {
          fileUrl = await uploadMarketFile(pendingFiles.mainFile, targetId, 'files');
          fileName = pendingFiles.mainFile.name;
        }
        let previewUrls = it.previewUrls || [];
        if (pendingFiles.previewFiles.length) {
          const uploaded = await Promise.all(pendingFiles.previewFiles.map(f => uploadMarketFile(f, targetId, 'previews')));
          previewUrls = previewUrls.concat(uploaded);
        }
        const tags = {};
        backdrop.querySelectorAll('.itTagChk:checked').forEach(chk => { tags[chk.value] = true; });
        const publishVal = backdrop.querySelector('#itPublishAt').value;
        const discActive = backdrop.querySelector('#itDiscActive').checked;
        const chosenType = backdrop.querySelector('#itType').value;
        let payloadExtra = {}, langCode = null;
        if (chosenType === 'wordPack'){
          langCode = backdrop.querySelector('#itWordPackLang').value || null;
          const lines = backdrop.querySelector('#itWordPackList').value.split('\n').map(l => l.trim()).filter(Boolean);
          const words = lines.map(line => {
            const isSentence = /\(sentence\)\s*$/i.test(line);
            const clean = line.replace(/\(sentence\)\s*$/i, '').trim();
            const parts = clean.split(/\s-\s|\s\|\s/);
            const de = (parts[0] || '').trim();
            const fa = (parts.slice(1).join(' - ') || '').trim();
            if (!de || !fa) return null;
            return { de, fa, type: isSentence ? 'sentence' : 'word' };
          }).filter(Boolean);
          if (!words.length) { toast('حداقل یه کلمه با فرمت «کلمه - معنی» لازمه', 'err'); saveBtn.disabled = false; saveBtn.textContent = 'ذخیره'; return; }
          payloadExtra = { words };
        } else if (chosenType === 'coinPack'){
          const coins = parseInt(backdrop.querySelector('#itCoinPackAmount').value, 10) || 0;
          if (!coins) { toast('تعداد سکه رو مشخص کن', 'err'); saveBtn.disabled = false; saveBtn.textContent = 'ذخیره'; return; }
          payloadExtra = { coins };
        }
        const payload = {
          name,
          description: backdrop.querySelector('#itDesc').value.trim(),
          type: chosenType,
          categoryId: backdrop.querySelector('#itCategory').value || null,
          tags,
          fileUrl, fileName, previewUrls,
          coinPrice: parseInt(backdrop.querySelector('#itCoinPrice').value, 10) || 0,
          cashPrice: parseInt(backdrop.querySelector('#itCashPrice').value, 10) || 0,
          free: backdrop.querySelector('#itFree').checked,
          discount: discActive ? {
            active: true,
            kind: backdrop.querySelector('#itDiscKind').value,
            value: parseFloat(backdrop.querySelector('#itDiscValue').value) || 0,
            startAt: backdrop.querySelector('#itDiscStart').value ? new Date(backdrop.querySelector('#itDiscStart').value).getTime() : null,
            endAt: backdrop.querySelector('#itDiscEnd').value ? new Date(backdrop.querySelector('#itDiscEnd').value).getTime() : null,
          } : null,
          publishAt: publishVal ? new Date(publishVal).getTime() : null,
          published: true,
          active: backdrop.querySelector('#itActive').checked,
          updatedAt: Date.now(),
        };
        if (chosenType === 'wordPack' || chosenType === 'coinPack'){
          payload.payload = payloadExtra;
          if (chosenType === 'wordPack') payload.langCode = langCode;
        }
        if (isNew) payload.createdAt = Date.now();
        await fbDb.ref('market/items/' + targetId).update(payload);
        toast('آیتم ذخیره شد', 'ok');
        backdrop.remove();
        state.marketLoaded = false;
        await loadMarketData(true);
        paintMarketItemList();
      } catch(e) {
        console.error('save item error:', e);
        toast('خطا در ذخیره‌سازی آیتم' + (e && e.message ? ': ' + e.message : ''), 'err');
      } finally {
        saveBtn.disabled = false; saveBtn.textContent = 'ذخیره';
      }
    });
  }

  async function deleteMarketItem(itemId){

      state.marketItems = state.marketItems.filter(i => i.id !== itemId);

          <button class="btn-confirm" id="catSaveBtn">ذخیره</button>
        </div>
      </div>

    backdrop.querySelector('#catCancelBtn').addEventListener('click', () => backdrop.remove());

      const name = backdrop.querySelector('#catName').value.trim();
      if (!name) { toast('نام دسته الزامی است', 'err'); return; }
      try {
        const targetId = isNew ? fbDb.ref('market/categories').push().key : catId;
        await fbDb.ref('market/categories/' + targetId).update({ name, order: c.order || 0, createdAt: c.createdAt || Date.now() });

        const targetId = isNew ? fbDb.ref('market/subscriptionPlans').push().key : planId;

        const payload = {
          name,
          period: backdrop.querySelector('#planPeriod').value,
          priceToman: parseInt(backdrop.querySelector('#planPrice').value, 10) || 0,
          benefits,

  // --------- نظرات کاربران ---------
  async function paintMarketReviews(){
    const body = document.getElementById('marketBody');
    if (!body) return;
    body.innerHTML = `<div class="empty-state"><span class="loading-spin"></span></div>`;
    try {
      const itemIds = state.marketItems.map(i => i.id);
      const snaps = await Promise.all(itemIds.map(id => fbDb.ref('market/items/' + id + '/reviews').once('value')));
      const allReviews = [];
      snaps.forEach((snap, idx) => {
        const val = snap.val();
        if (!val) return;
        const itemId = itemIds[idx];
        const item = state.marketItems.find(i => i.id === itemId);
        Object.keys(val).forEach(reviewId => {
          allReviews.push({ id: reviewId, itemId, itemName: item ? item.name : itemId, ...val[reviewId] });
        });
      });
      allReviews.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (!allReviews.length) {
        body.innerHTML = `<div class="empty-state">${icon('star',46)}<p>نظری ثبت نشده.</p></div>`;
        return;
      }
      body.innerHTML = `
        <div class="card" style="padding:0;overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>آیتم</th><th>کاربر</th><th>امتیاز</th><th>متن</th><th>تاریخ</th><th></th></tr></thead>
            <tbody>
              ${allReviews.map(r => `
                <tr>
                  <td style="font-weight:600">${esc(r.itemName || '')}</td>
                  <td style="font-size:12px;color:var(--muted)">${esc(r.userName || '')}</td>
                  <td class="mono">${'★'.repeat(r.rating || 0)}</td>
                  <td style="font-size:12px;max-width:260px">${esc(r.text || '')}</td>
                  <td style="font-size:11px;color:var(--placeholder)">${fmtDate(r.createdAt)}</td>
                  <td><button class="icon-btn" title="حذف نظر" onclick="__admin.deleteMarketReview('${r.itemId}','${r.id}')">${icon('trash',14)}</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div style="margin-top:10px;font-size:11.5px;color:var(--placeholder)">${faNum(allReviews.length)} نظر</div>
      `;
    } catch(e) {
      console.error('paintMarketReviews error:', e);
      body.innerHTML = `<div class="empty-state"><p>خطا در بارگذاری نظرات.</p></div>`;
    }
  }
