<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت · جعبه لایتنر</title>
<link rel="icon" href="icon-hero.png">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #14161f; --bg-radial: #1c2033; --panel: #1e2230; --panel2: #262b3d; --panel3: #2c3145;
    --ivory: #ede6d6; --text: #ede6d6; --muted: #9aa0b4; --placeholder: #6b7189;
    --brass: #c9a66b; --brass-dark: #a9824f; --brass-glow: rgba(201,166,107,0.16);
    --wine: #b65c5c; --wine-glow: rgba(182,92,92,0.16);
    --sage: #8fa37a; --sage-strong: #4fb86a; --sage-glow: rgba(79,184,106,0.16);
    --teal: #3fc1c9; --teal-dark: #2b969d; --teal-glow: rgba(63,193,201,0.14);
    --violet: #8B6FC9;
    --border: #333854; --border2: #3c4260; --divider: #292d40;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f3f0e8; --bg-radial: #ffffff; --panel: #ffffff; --panel2: #f1ede2; --panel3: #e9e3d4;
    --ivory: #2a271f; --text: #2a271f; --muted: #7a7566; --placeholder: #a39d8c;
    --brass: #a9824f; --brass-dark: #8a6a3e; --brass-glow: rgba(169,130,79,0.14);
    --wine: #b6504f; --wine-glow: rgba(182,80,79,0.12);
    --sage: #6c8a56; --sage-strong: #3f9556; --sage-glow: rgba(63,149,86,0.14);
    --teal: #2b969d; --teal-dark: #1f7278; --teal-glow: rgba(43,150,157,0.12);
    --violet: #7457b0;
    --border: #e2ddd0; --border2: #d6cfbd; --divider: #eae5d9;
    --shadow: 0 6px 18px rgba(60,50,30,0.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--bg-radial) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(139,111,201,0.08) 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  ::selection { background: var(--brass-glow); color: var(--brass); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }

  /* ---------- Auth gate ---------- */
  #authGate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 18px; padding: 32px 28px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .auth-card::before {
    content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 6px;
    background: repeating-linear-gradient(180deg, var(--brass) 0 14px, transparent 14px 22px);
    opacity: 0.55;
  }
  .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .auth-brand .box-icon { width: 34px; height: 34px; flex-shrink: 0; }
  .box-icon.img-logo { border-radius: 8px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .auth-brand h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .auth-sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 24px; line-height: 1.7; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--brass); }
  .btn-primary {
    width: 100%; background: var(--brass); color: #1a1710; border: none; border-radius: 10px;
    padding: 12px; font-size: 14px; font-weight: 700; margin-top: 6px; transition: filter 0.15s, transform 0.1s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-error {
    background: var(--wine-glow); border: 1px solid rgba(182,92,92,0.35); color: #e0a3a3;
    border-radius: 8px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 14px; display: none; line-height: 1.6;
  }

  /* ---------- App shell ---------- */
  #app { display: none; min-height: 100vh; }
  #app.show { display: flex; }

  .sidebar {
    width: 208px; flex-shrink: 0; background: var(--panel); border-inline-end: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 14px 10px; gap: 3px; position: sticky; top: 0; height: 100vh;
  }
  .side-brand { display: flex; align-items: center; gap: 8px; padding: 4px 6px 14px; }
  .side-brand .box-icon { width: 24px; height: 24px; flex-shrink: 0; }
  .side-brand span { font-size: 13.5px; font-weight: 700; }
  .side-brand small { display: block; color: var(--muted); font-size: 10px; font-weight: 400; margin-top: 1px; }

  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--border2); color: var(--muted);
    border-radius: 9px; padding: 7px; font-size: 11.5px; font-weight: 500; width: 100%;
    margin-bottom: 8px; transition: border-color 0.15s, color 0.15s;
  }
  .theme-toggle:hover { border-color: var(--brass); color: var(--text); }
  .theme-toggle svg { width: 14px; height: 14px; flex-shrink: 0; }

  .drawer-tab {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 9px;
    background: none; color: var(--muted); font-size: 12.5px; font-weight: 500; position: relative;
    border: 1px solid transparent; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .drawer-tab:hover { background: var(--panel2); color: var(--text); }
  .drawer-tab.active { background: var(--panel2); color: var(--brass); border-color: var(--border2); }
  .drawer-tab.active::before {
    content: ''; position: absolute; inset-inline-start: -12px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 16px; background: var(--brass); border-radius: 3px;
  }
  .drawer-tab .dtab-icon { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.9; }
  .drawer-tab .badge-count {
    margin-inline-start: auto; background: var(--wine); color: #fff; font-size: 10px; font-weight: 700;
    border-radius: 20px; padding: 1px 6px; font-family: 'JetBrains Mono', monospace;
  }
  .sidebar-foot { margin-top: auto; padding: 8px 6px 2px; border-top: 1px solid var(--divider); }
  .sidebar-foot .who { font-size: 11px; color: var(--muted); margin-bottom: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-ghost {
    width: 100%; background: transparent; border: 1px solid var(--border2); color: var(--muted);
    border-radius: 9px; padding: 7px; font-size: 12px; transition: border-color 0.15s, color 0.15s;
  }
  .btn-ghost:hover { border-color: var(--wine); color: #e0a3a3; }

  .main { flex: 1; min-width: 0; padding: 22px 26px 50px; max-width: 1180px; }
  .page-head { margin-bottom: 18px; }
  .page-head h2 { font-size: 17px; margin: 0 0 3px; font-weight: 700; }
  .page-head p { color: var(--muted); font-size: 12px; margin: 0; }

  /* ---------- Cards / index-card motif ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .index-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px;
    position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .index-card::before {
    content: ''; position: absolute; inset-inline-start: 20px; top: 0; width: 30px; height: 7px;
    background: var(--panel3); border: 1px solid var(--border2); border-top: none;
    border-radius: 0 0 5px 5px; opacity: 0.7;
  }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px; margin-bottom: 18px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat-card .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .stat-card .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 21px; font-weight: 600; }
  .stat-card .stat-value.brass { color: var(--brass); }
  .stat-card .stat-value.sage { color: var(--sage-strong); }
  .stat-card .stat-value.teal { color: var(--teal); }
  .stat-card .stat-value.wine { color: var(--wine); }
  .stat-card .stat-sub { font-size: 10.5px; color: var(--placeholder); margin-top: 3px; }

  .league-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 20px;
    font-size: 11px; font-weight: 600; border: 1px solid transparent;
  }
  .league-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .lesson-row {
    display: flex; align-items: center; gap: 11px; padding: 10px 13px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 11px; margin-bottom: 8px;
  }
  .lesson-flag { font-size: 18px; }
  .lesson-name { font-weight: 600; font-size: 12.5px; flex-shrink: 0; width: 84px; }
  .presence-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage-strong); box-shadow: 0 0 0 3px var(--sage-glow); }
  .lesson-stats { display: flex; gap: 14px; margin-inline-start: auto; }
  .lesson-stats .ls { text-align: center; }
  .lesson-stats .ls .n { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; }
  .lesson-stats .ls .l { font-size: 9.5px; color: var(--muted); }
  .btn-small {
    background: var(--panel2); border: 1px solid var(--border2); color: var(--text); border-radius: 8px;
    padding: 6px 11px; font-size: 11.5px; font-weight: 500; transition: border-color 0.15s;
  }
  .btn-small:hover { border-color: var(--brass); }

  .online-user-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--border2);
    border-radius: 20px; padding: 4px 10px 4px 7px; font-size: 11.5px; margin: 3px;
  }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th {
    text-align: right; color: var(--muted); font-weight: 500; font-size: 11px; padding: 7px 10px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--divider); vertical-align: middle; }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table tr:hover td { background: rgba(255,255,255,0.015); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 600; }
  .pill.open { background: var(--wine-glow); color: #e0a3a3; }
  .pill.answered { background: var(--sage-glow); color: var(--sage-strong); }
  .pill.closed { background: rgba(154,160,180,0.14); color: var(--muted); }
  .pill.banned { background: var(--wine-glow); color: #e0a3a3; }
  .pill.active { background: var(--sage-glow); color: var(--sage-strong); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 13px; flex-wrap: wrap; }
  .search-input {
    background: var(--panel); border: 1px solid var(--border2); color: var(--text); border-radius: 10px;
    padding: 8px 12px; font-size: 12.5px; min-width: 200px; outline: none;
  }
  .search-input:focus { border-color: var(--brass); }
  select.filter-select {
    background: var(--panel); border: 1px solid var(--border2); color: var(--text); border-radius: 10px;
    padding: 8px 11px; font-size: 12.5px; outline: none;
  }

  .icon-btn {
    width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; color: var(--muted);
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--brass); }
  .icon-btn svg { width: 14px; height: 14px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,11,17,0.65); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  [data-theme="light"] .modal-backdrop { background: rgba(40,35,25,0.35); }
  .modal-card {
    background: var(--panel); border: 1px solid var(--border2); border-radius: 15px; padding: 20px;
    width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow);
  }
  .modal-card h3 { margin: 0 0 4px; font-size: 16px; }
  .modal-card .modal-sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-secondary {
    flex: 1; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600;
  }
  .btn-danger {
    flex: 1; background: var(--wine); border: none; color: #fff; border-radius: 10px; padding: 10px;
    font-size: 13px; font-weight: 700;
  }
  .btn-confirm {
    flex: 1; background: var(--sage-strong); border: none; color: #0e1a10; border-radius: 10px; padding: 10px;
    font-size: 13px; font-weight: 700;
  }
  textarea.ta {
    width: 100%; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; outline: none; resize: vertical; min-height: 80px;
    line-height: 1.65; font-family: inherit;
  }
  textarea.ta:focus, input.mfield:focus { border-color: var(--brass); }
  input.mfield {
    width: 100%; background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 9px 11px; font-size: 13px; outline: none;
  }
  .mfield-row { display: flex; gap: 9px; }
  .mfield-row > div { flex: 1; }
  .mlabel { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; }
  .mfield-group { margin-bottom: 11px; }

  .empty-state {
    text-align: center; padding: 46px 18px; color: var(--muted);
  }
  .empty-state svg { width: 38px; height: 38px; opacity: 0.35; margin-bottom: 12px; }
  .empty-state p { font-size: 12.5px; margin: 0; }

  .loading-spin {
    display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--brass); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--panel3); border: 1px solid var(--border2); color: var(--text); padding: 10px 18px;
    border-radius: 30px; font-size: 12.5px; box-shadow: var(--shadow); animation: toastIn 0.2s ease;
  }
  .toast.ok { border-color: rgba(79,184,106,0.4); }
  .toast.err { border-color: rgba(182,92,92,0.4); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }

  .tab-strip { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--divider); overflow-x: auto; }
  .tab-strip button {
    background: none; border: none; color: var(--muted); font-size: 12.5px; padding: 8px 3px; margin-inline-end: 15px;
    border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; flex-shrink: 0;
  }
  .tab-strip button.active { color: var(--brass); border-color: var(--brass); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

  @media (max-width: 860px) {
    #app.show { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: sticky; top: 0; z-index: 50;
      flex-direction: row; padding: 8px 10px; gap: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      border-inline-end: none; border-bottom: 1px solid var(--border);
    }
    .side-brand, .sidebar-foot { display: none; }
    .theme-toggle {
      width: auto; flex-shrink: 0; margin-bottom: 0; padding: 0; border: none; background: none;
      align-self: center;
    }
    .theme-toggle span { display: none; }
    .theme-toggle svg { width: 19px; height: 19px; }
    /* #drawerTabs is the only visible child of .sidebar on mobile — it needs its own
       horizontal flex layout, otherwise each .drawer-tab (which is display:flex) collapses
       to a block box and the tabs stack on top of each other instead of sitting in a row. */
    #drawerTabs {
      display: flex; gap: 7px; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding: 2px 1px;
    }
    #drawerTabs::-webkit-scrollbar { display: none; }
    .drawer-tab {
      flex-shrink: 0; white-space: nowrap; flex-direction: column; gap: 3px;
      padding: 7px 12px 6px; border-radius: 14px; font-size: 10.5px;
      background: var(--panel2); border: 1px solid var(--border);
    }
    .drawer-tab span:not(.dtab-icon):not(.badge-count) { font-size: 10px; }
    .drawer-tab .dtab-icon { width: 16px; height: 16px; }
    .drawer-tab.active {
      background: var(--brass-glow); color: var(--brass); border-color: var(--brass);
    }
    .drawer-tab.active::before { display: none; } /* the vertical accent bar only makes sense in a column layout */
    .drawer-tab .badge-count { position: absolute; top: -4px; inset-inline-end: -4px; margin: 0; }
    .main { padding: 14px 12px 40px; }
    .page-head h2 { font-size: 15.5px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-card { padding: 10px 12px; }
    .stat-card .stat-value { font-size: 18px; }
  }
</style>
</head>
<body>
<script>
  (function(){
    try {
      var saved = localStorage.getItem('leitnerAdminTheme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch(e){}
  })();
</script>

<div id="authGate">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="box-icon img-logo" src="icon-hero.png" alt="">
      <h1>پنل مدیریت جعبه لایتنر</h1>
    </div>
    <p class="auth-sub">فقط حساب‌های مدیر مجاز به ورود هستند.</p>
    <div class="auth-error" id="authErrorBox"></div>
    <form id="authForm">
      <div class="field">
        <label>ایمیل مدیر</label>
        <input type="email" id="authEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input type="password" id="authPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="authSubmitBtn">ورود</button>
    </form>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="side-brand">
      <img class="box-icon img-logo" src="icon-hero.png" alt="">
      <span>جعبه لایتنر<small>پنل مدیریت</small></span>
    </div>
    <button class="theme-toggle" id="themeToggleBtn" type="button" title="تغییر پوسته"></button>
    <div id="drawerTabs"></div>
    <div class="sidebar-foot">
      <div class="who mono" id="whoBox">—</div>
      <button class="btn-ghost" id="signOutBtn">خروج از حساب</button>
    </div>
  </aside>
  <main class="main" id="mainArea"></main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

  async function loadNewUsersStats(){
    const DAY = 86400000;
    const empty = { day: 0, week: 0, month: 0, sixMonth: 0 };
    try {
      const snap = await fbDb.ref('users').once('value');
      const val = snap.val() || {};
      const now = Date.now();
      const result = { ...empty };
      Object.keys(val).forEach((uid) => {
        const createdAt = val[uid] && val[uid].createdAt;
        if (typeof createdAt !== 'number') return;
        const diff = now - createdAt;
        if (diff < 0) return;
        if (diff <= DAY) result.day++;
        if (diff <= 7 * DAY) result.week++;
        if (diff <= 30 * DAY) result.month++;
        if (diff <= 182 * DAY) result.sixMonth++;
      });
      return result;
    } catch (e) {
      console.error('loadNewUsersStats error:', e);
      return empty;
    }
  }

  function fmtBytes(bytes){
    bytes = Number(bytes) || 0;
    if (bytes <= 0) return '۰ کیلوبایت';
    const units = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت'];
    let i = 0;
    let val = bytes;
    while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
    const rounded = val >= 100 ? Math.round(val) : Math.round(val * 10) / 10;
    return faNum(rounded) + ' ' + units[i];
  }

      ['image', 'video', 'audio'].forEach((type) => {
        const entry = val[type];
        if (entry) out[type] = { count: entry.count || 0, totalBytes: entry.totalBytes || 0 };
      });
    } catch (e) {
      console.error('loadMediaStats error:', e);
    }
    return out;
  }

  function updateSupportBadge(count){

  // ===================== Support tickets =====================

  const TICKET_STATUS_FA = { open: 'در حال بررسی', answered: 'پاسخ داده شد', closed: 'بسته شده' };

  async function renderSupport(){
    const main = document.getElementById('mainArea');
    main.innerHTML = `
      <div class="page-head">
        <h2>تیکت‌های پشتیبانی</h2>
        <p>پاسخ‌ها بلافاصله برای کاربر در اپ نمایش داده می‌شن</p>
      </div>
      <div class="toolbar">
        <select class="filter-select" id="ticketFilterSel">
          <option value="all">همه وضعیت‌ها</option>
          <option value="open">در حال بررسی</option>
          <option value="answered">پاسخ داده شده</option>
          <option value="closed">بسته شده</option>

      </div>
      <div id="ticketListWrap"><div class="empty-state"><span class="loading-spin"></span></div></div>

    document.getElementById('ticketFilterSel').value = state.ticketFilter;

      state.ticketFilter = e.target.value;

  function paintTicketList(){
    const wrap = document.getElementById('ticketListWrap');
    if (!wrap) return;
    let list = state.tickets;
    if (state.ticketFilter !== 'all') list = list.filter(t => t.status === state.ticketFilter);
    if (list.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${icon('support', 46)}<p>تیکتی یافت نشد.</p></div>`;
      return;
    }
    wrap.innerHTML = list.map(t => `

            <div style="font-weight:700;font-size:13.5px;margin-bottom:3px">${esc(t.username || 'کاربر')}</div>
            <div class="mono" style="font-size:11px;color:var(--placeholder)">${fmtDate(t.createdAt)} · ${esc(TICKET_CATEGORY_FA[t.category] || t.category || '—')}</div>
          </div>
          <span class="pill ${esc(t.status || 'open')}">${esc(TICKET_STATUS_FA[t.status] || t.status || '—')}</span>
        </div>
        <div style="font-size:13px;line-height:1.8;background:var(--panel2);border-radius:9px;padding:11px 13px;margin-bottom:10px">${esc(t.message || '')}</div>
        ${t.adminReply ? `
          <div style="font-size:12.5px;line-height:1.8;background:var(--sage-glow);border:1px solid rgba(79,184,106,0.25);border-radius:9px;padding:11px 13px;margin-bottom:10px">
            <div style="font-size:10.5px;color:var(--sage-strong);font-weight:700;margin-bottom:5px">پاسخ پشتیبانی</div>
            ${esc(t.adminReply)}
          </div>
        ` : ''}
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn-small" onclick="__admin.openReplyModal('${esc(t.id)}')">${t.adminReply ? 'ویرایش پاسخ' : 'پاسخ‌دهی'}</button>
          ${t.status !== 'closed' ? `<button class="btn-small" onclick="__admin.setTicketStatus('${esc(t.id)}','closed')">بستن تیکت</button>` : `<button class="btn-small" onclick="__admin.setTicketStatus('${esc(t.id)}','open')">بازکردن دوباره</button>`}
          <button class="btn-small" style="color:#e0a3a3;border-color:rgba(182,92,92,0.4)" onclick="__admin.deleteTicket('${esc(t.id)}')">${icon('trash',12)} حذف تیکت</button>
        </div>
      </div>
    `).join('');

  function openReplyModal(ticketId){
    const t = state.tickets.find(x => x.id === ticketId);
    if (!t) return;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3>پاسخ به تیکت</h3>
        <div class="modal-sub">${esc(t.username || 'کاربر')} · ${esc(TICKET_CATEGORY_FA[t.category] || '')}</div>
        <div style="font-size:12.5px;line-height:1.8;background:var(--panel2);border-radius:9px;padding:11px 13px;margin-bottom:14px;max-height:120px;overflow-y:auto">${esc(t.message || '')}</div>
        <div class="mfield-group">
          <label class="mlabel">پاسخ شما</label>
          <textarea class="ta" id="replyText" placeholder="پاسخت رو بنویس...">${esc(t.adminReply || '')}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="replyCancelBtn">انصراف</button>
          <button class="btn-confirm" id="replySendBtn">ارسال پاسخ</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#replyCancelBtn').addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#replySendBtn').addEventListener('click', async () => {
      const reply = backdrop.querySelector('#replyText').value.trim();
      if (!reply) { toast('پاسخ نمی‌تونه خالی باشه', 'err'); return; }
      try {
        await fbDb.ref('supportTickets/' + ticketId).update({
          adminReply: reply, status: 'answered', updatedAt: Date.now()
        });
        t.adminReply = reply; t.status = 'answered';
        toast('پاسخ ارسال شد', 'ok');
        backdrop.remove();
        paintTicketList();
      } catch(e) { toast('خطا در ارسال پاسخ', 'err'); }
    });
  }

  async function setTicketStatus(ticketId, status){
    try {
      await fbDb.ref('supportTickets/' + ticketId).update({ status, updatedAt: Date.now() });
      const t = state.tickets.find(x => x.id === ticketId);
      if (t) t.status = status;
      paintTicketList();
      toast(status === 'closed' ? 'تیکت بسته شد' : 'تیکت دوباره باز شد', 'ok');
    } catch(e) { toast('خطا در تغییر وضعیت', 'err'); }
  }

  // حذف کامل تیکت از دیتابیس — چون هم پنل مدیریت و هم اپ کاربر مستقیماً از همین مسیر
  // (supportTickets/{id}) می‌خونن، این حذف هم از لیست ادمین پاک می‌شه و هم از تاریخچه‌ی کاربر.
  async function deleteTicket(ticketId){
    if (!confirm('این تیکت برای همیشه حذف بشه؟ این کار هم از پنل مدیریت و هم از تاریخچه‌ی تیکت‌های کاربر پاکش می‌کنه.')) return;
    try {
      await fbDb.ref('supportTickets/' + ticketId).remove();
      state.tickets = state.tickets.filter(t => t.id !== ticketId);
      paintTicketList();
      toast('تیکت حذف شد', 'ok');
    } catch(e) { toast('خطا در حذف تیکت', 'err'); }
  }

  // ===================== Users =====================
  async function renderUsers(){
    const main = document.getElementById('mainArea');
    main.innerHTML = `
      <div class="page-head">
        <h2>مدیریت کاربران</h2>
        <p>مسدودسازی، ویرایش نام، سطح/امتیاز و مجوز ساخت گروه</p>
      </div>
      <div class="toolbar">
        <input class="search-input" id="userSearchInput" placeholder="جستجو با نام یا آیدی کاربری...">
      </div>
      <div id="userTableWrap"><div class="empty-state"><span class="loading-spin"></span></div></div>
    `;
    document.getElementById('userSearchInput').value = state.userSearch;
    document.getElementById('userSearchInput').addEventListener('input', (e) => {
      state.userSearch = e.target.value.trim().toLowerCase();
      paintUserTable();
    });

    if (!state.usersLoaded) {
      try {
        const [leaderSnap, bansSnap, permsSnap, usersSnap] = await Promise.all([
          fbDb.ref('leaderboard').once('value'),
          fbDb.ref('bans').once('value'),
          fbDb.ref('permissions').once('value'),
          fbDb.ref('users').once('value'),
        ]);
        const leaderVal = leaderSnap.val() || {};
        const usersVal = usersSnap.val() || {};
        state.bans = bansSnap.val() || {};
        state.permissions = {};
        state.aiPermissions = {};
        state.userIdMaxChangesCache = {};
        const permsVal = permsSnap.val() || {};
        Object.keys(permsVal).forEach(uid => {
          state.permissions[uid] = !!(permsVal[uid] && permsVal[uid].canCreateGroups);
          state.aiPermissions[uid] = !!(permsVal[uid] && permsVal[uid].canUseAi);
          if (permsVal[uid] && typeof permsVal[uid].userIdMaxChanges === 'number') {
            state.userIdMaxChangesCache[uid] = permsVal[uid].userIdMaxChanges;
          }
        });
        state.userXpBonusCache = {};
        Object.keys(usersVal).forEach(uid => { state.userXpBonusCache[uid] = usersVal[uid].adminXpBonus || 0; });
        state.users = Object.keys(leaderVal).map(uid => ({ uid, ...leaderVal[uid] }))
          .sort((a,b) => (b.xp||0) - (a.xp||0));
        state.usersLoaded = true;
      } catch(e) {
        console.error('loadUsers error:', e);
        toast('خطا در بارگذاری کاربران: ' + (e && e.message ? e.message : 'نامشخص'), 'err');
        state.users = [];
      }
    }
    paintUserTable();
  }

  function paintUserTable(){
    const wrap = document.getElementById('userTableWrap');
    if (!wrap) return;
    let list = state.users;
    if (state.userSearch) {
      list = list.filter(u =>
        (u.name || '').toLowerCase().includes(state.userSearch) ||
        (u.userId || '').toLowerCase().includes(state.userSearch)
      );
    }
    if (list.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${icon('users', 46)}<p>کاربری یافت نشد.</p></div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="card" style="padding:0;overflow-x:auto">
        <table class="data-table">
          <thead><tr>
            <th>کاربر</th><th>آیدی</th><th>سطح</th><th>لیگ</th><th>XP</th><th>مجوز گروه</th><th>هوش مصنوعی</th><th>وضعیت</th><th></th>
          </tr></thead>
          <tbody>
            ${list.map(u => renderUserRow(u)).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderUserRow(u){
    const ban = state.bans[u.uid];
    const isBanned = !!(ban && (!ban.until || ban.until > Date.now()));
    const bonus = (state.userXpBonusCache && state.userXpBonusCache[u.uid]) || 0;
    const xpTotal = (u.xp || 0) + bonus;
    const info = computeLevelInfo(xpTotal);
    const canGroup = !!state.permissions[u.uid];
    const canAi = !!state.aiPermissions[u.uid];
    return `
      <tr data-uid="${esc(u.uid)}">
        <td>${esc(u.name || '—')}</td>
        <td class="mono" style="color:var(--muted)">@${esc(u.userId || '—')}</td>
        <td class="mono">${faNum(info.level)}</td>
        <td>${leaguePillHtml(info.level)}</td>
        <td class="mono">${faNum(xpTotal)}</td>
        <td>${canGroup ? `<span class="pill active">${icon('check',11)} دارد</span>` : `<span style="color:var(--placeholder);font-size:12px">ندارد</span>`}</td>
        <td>${canAi ? `<span class="pill active">${icon('check',11)} دارد</span>` : `<span style="color:var(--placeholder);font-size:12px">ندارد</span>`}</td>
        <td>${isBanned ? `<span class="pill banned">${icon('ban',11)} مسدود</span>` : `<span class="pill active">فعال</span>`}</td>
        <td>
          <div style="display:flex;gap:6px;justify-content:flex-end">
            <button class="icon-btn" title="ویرایش" onclick="__admin.openEditUserModal('${esc(u.uid)}')">${icon('edit',14)}</button>
            <button class="icon-btn" title="${isBanned ? 'رفع مسدودی' : 'مسدودسازی'}" onclick="__admin.openBanModal('${esc(u.uid)}')">${icon('ban',14)}</button>
          </div>
        </td>
      </tr>
    `;
  }

  const DEFAULT_USER_ID_MAX_CHANGES = 2; // مقدار پیش‌فرض توی خود اپ، اگه برای کاربر خاصی چیزی تنظیم نشه

  function openEditUserModal(uid){
    const u = state.users.find(x => x.uid === uid);
    if (!u) return;
    const bonus = (state.userXpBonusCache && state.userXpBonusCache[uid]) || 0;
    const canGroup = !!state.permissions[uid];
    const canAi = !!state.aiPermissions[uid];
    const maxIdChanges = (state.userIdMaxChangesCache && typeof state.userIdMaxChangesCache[uid] === 'number')
      ? state.userIdMaxChangesCache[uid] : DEFAULT_USER_ID_MAX_CHANGES;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3>ویرایش کاربر</h3>
        <div class="modal-sub mono">@${esc(u.userId || '')} · ${esc(uid)}</div>
        <div class="mfield-group">
          <label class="mlabel">نام نمایشی</label>
          <input class="mfield" id="editName" value="${esc(u.name || '')}">
        </div>
        <div class="mfield-group">
          <label class="mlabel">امتیاز جایزه (به XP واقعی کاربر اضافه می‌شود)</label>
          <input class="mfield" id="editXpBonus" type="number" value="${bonus}">
        </div>
        <div class="mfield-group">
          <label class="mlabel">تعداد دفعات مجاز تغییر آیدی (پیش‌فرض اپ: ${faNum(DEFAULT_USER_ID_MAX_CHANGES)})</label>
          <input class="mfield" id="editIdMaxChanges" type="number" min="0" value="${maxIdChanges}">
        </div>
        <div class="mfield-group" style="display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:10px 13px">
          <span style="font-size:13px">مجوز ساخت گروه</span>
          <label style="position:relative;display:inline-block;width:40px;height:22px">
            <input type="checkbox" id="editCanGroup" ${canGroup ? 'checked' : ''} style="opacity:0;width:0;height:0">
            <span id="toggleTrackGroup" style="position:absolute;inset:0;background:${canGroup ? 'var(--sage-strong)' : 'var(--border2)'};border-radius:20px;transition:0.15s;cursor:pointer"></span>
          </label>
        </div>
        <div class="mfield-group" style="display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:10px 13px">
          <span style="font-size:13px">مجوز استفاده از هوش مصنوعی (Gemini)</span>
          <label style="position:relative;display:inline-block;width:40px;height:22px">
            <input type="checkbox" id="editCanAi" ${canAi ? 'checked' : ''} style="opacity:0;width:0;height:0">
            <span id="toggleTrackAi" style="position:absolute;inset:0;background:${canAi ? 'var(--sage-strong)' : 'var(--border2)'};border-radius:20px;transition:0.15s;cursor:pointer"></span>
          </label>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="editCancelBtn">انصراف</button>
          <button class="btn-confirm" id="editSaveBtn">ذخیره تغییرات</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const checkbox = backdrop.querySelector('#editCanGroup');
    const track = backdrop.querySelector('#toggleTrackGroup');
    track.addEventListener('click', () => {
      checkbox.checked = !checkbox.checked;
      track.style.background = checkbox.checked ? 'var(--sage-strong)' : 'var(--border2)';
    });
    const aiCheckbox = backdrop.querySelector('#editCanAi');
    const aiTrack = backdrop.querySelector('#toggleTrackAi');
    aiTrack.addEventListener('click', () => {
      aiCheckbox.checked = !aiCheckbox.checked;
      aiTrack.style.background = aiCheckbox.checked ? 'var(--sage-strong)' : 'var(--border2)';
    });
    backdrop.addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#editCancelBtn').addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#editSaveBtn').addEventListener('click', async () => {
      const newName = backdrop.querySelector('#editName').value.trim();
      const newBonus = parseInt(backdrop.querySelector('#editXpBonus').value, 10) || 0;
      const newCanGroup = checkbox.checked;
      const newCanAi = aiCheckbox.checked;
      let newMaxIdChanges = parseInt(backdrop.querySelector('#editIdMaxChanges').value, 10);
      if (isNaN(newMaxIdChanges) || newMaxIdChanges < 0) newMaxIdChanges = DEFAULT_USER_ID_MAX_CHANGES;
      try {
        await Promise.all([
          fbDb.ref('leaderboard/' + uid).update({ name: newName || u.name || 'کاربر' }),
          fbDb.ref('users/' + uid + '/adminXpBonus').set(newBonus),
          fbDb.ref('permissions/' + uid + '/canCreateGroups').set(newCanGroup),
          fbDb.ref('permissions/' + uid + '/canUseAi').set(newCanAi),
          fbDb.ref('permissions/' + uid + '/userIdMaxChanges').set(newMaxIdChanges),
        ]);
        u.name = newName || u.name;
        if (!state.userXpBonusCache) state.userXpBonusCache = {};
        state.userXpBonusCache[uid] = newBonus;
        state.permissions[uid] = newCanGroup;
        if (!state.aiPermissions) state.aiPermissions = {};
        state.aiPermissions[uid] = newCanAi;
        if (!state.userIdMaxChangesCache) state.userIdMaxChangesCache = {};
        state.userIdMaxChangesCache[uid] = newMaxIdChanges;
        toast('تغییرات ذخیره شد', 'ok');
        backdrop.remove();
        paintUserTable();
      } catch(e) { toast('خطا در ذخیره‌سازی', 'err'); }
    });
  }

  function openBanModal(uid){
    const u = state.users.find(x => x.uid === uid);
    if (!u) return;
    const ban = state.bans[uid];
    const isBanned = !!(ban && (!ban.until || ban.until > Date.now()));
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    if (isBanned) {
      backdrop.innerHTML = `
        <div class="modal-card" onclick="event.stopPropagation()">
          <h3>رفع مسدودیت</h3>
          <div class="modal-sub">${esc(u.name || u.userId || 'کاربر')}</div>
          <p style="font-size:13px;color:var(--muted);line-height:1.8">این کاربر در حال حاضر مسدود است. آیا مسدودیتش برداشته شود؟</p>
          <div class="modal-actions">
            <button class="btn-secondary" id="banCancelBtn">انصراف</button>
            <button class="btn-confirm" id="unbanBtn">رفع مسدودی</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);
      backdrop.addEventListener('click', () => backdrop.remove());
      backdrop.querySelector('#banCancelBtn').addEventListener('click', () => backdrop.remove());
      backdrop.querySelector('#unbanBtn').addEventListener('click', async () => {
        try {
          await fbDb.ref('bans/' + uid).remove();
          delete state.bans[uid];
          toast('کاربر رفع مسدودیت شد', 'ok');
          backdrop.remove();
          paintUserTable();
        } catch(e) { toast('خطا', 'err'); }
      });
    } else {
      backdrop.innerHTML = `
        <div class="modal-card" onclick="event.stopPropagation()">
          <h3>مسدودسازی کاربر</h3>
          <div class="modal-sub">${esc(u.name || u.userId || 'کاربر')}</div>
          <div class="mfield-group">
            <label class="mlabel">نوع مسدودسازی</label>
            <select class="mfield" id="banType">
              <option value="permanent">دائمی</option>
              <option value="1">۱ روز</option>
              <option value="7">۷ روز</option>
              <option value="30">۳۰ روز</option>
            </select>
          </div>
          <div class="mfield-group">
            <label class="mlabel">دلیل (اختیاری)</label>
            <input class="mfield" id="banReason" placeholder="مثلاً نقض قوانین چت">
          </div>
          <div class="modal-actions">
            <button class="btn-secondary" id="banCancelBtn">انصراف</button>
            <button class="btn-danger" id="banConfirmBtn">مسدود کن</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);
      backdrop.addEventListener('click', () => backdrop.remove());
      backdrop.querySelector('#banCancelBtn').addEventListener('click', () => backdrop.remove());
      backdrop.querySelector('#banConfirmBtn').addEventListener('click', async () => {
        const type = backdrop.querySelector('#banType').value;
        const reason = backdrop.querySelector('#banReason').value.trim();
        const until = type === 'permanent' ? null : Date.now() + parseInt(type, 10) * 86400000;
        try {
          await fbDb.ref('bans/' + uid).set({ until, reason: reason || null, bannedAt: Date.now() });
          state.bans[uid] = { until, reason: reason || null, bannedAt: Date.now() };
          toast('کاربر مسدود شد', 'ok');
          backdrop.remove();
          paintUserTable();
        } catch(e) { toast('خطا', 'err'); }
      });
    }
  }

  window.__admin = { navigate, openReplyModal, setTicketStatus, deleteTicket, openEditUserModal, openBanModal, openWordModal, deleteWord, saveAppStatus, sendBroadcast, cancelBroadcast };

  // ===================== Content management =====================
  async function renderContent(){
    const main = document.getElementById('mainArea');
    main.innerHTML = `
      <div class="page-head">
        <h2>مدیریت محتوا</h2>
        <p>افزودن، ویرایش و حذف کلمات — تغییرات بلافاصله در اپ اعمال می‌شود</p>
      </div>
      <div class="tab-strip" id="langTabs"></div>
      <div class="toolbar">
        <select class="filter-select" id="levelSel">
          ${CURRICULUM_LEVELS.map(l => `<option value="${l}" ${l === state.contentLevel ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <input class="search-input" id="contentSearchInput" placeholder="جستجو در کلمات...">
        <button class="btn-small" style="margin-inline-start:auto;display:flex;align-items:center;gap:6px" id="addWordBtn">${icon('plus',14)} افزودن کلمه</button>
      </div>
      <div id="wordListWrap"><div class="empty-state"><span class="loading-spin"></span></div></div>
    `;

    document.getElementById('langTabs').innerHTML = LANGUAGE_CODES.map(code => `
      <button class="${code === state.contentLang ? 'active' : ''}" data-lang="${code}">${LANGUAGE_META[code].flag} ${LANGUAGE_META[code].native}</button>
    `).join('');
    document.querySelectorAll('#langTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        state.contentLang = btn.getAttribute('data-lang');
        state.contentWords = [];
        loadContentWords();
      });
    });
    document.getElementById('levelSel').addEventListener('change', (e) => {
      state.contentLevel = e.target.value;
      state.contentWords = [];
      loadContentWords();
    });
    document.getElementById('contentSearchInput').value = state.contentSearch;
    document.getElementById('contentSearchInput').addEventListener('input', (e) => {
      state.contentSearch = e.target.value.trim().toLowerCase();
      paintWordList();
    });
    document.getElementById('addWordBtn').addEventListener('click', () => openWordModal(null));

    if (state.contentLang !== 'de') {
      document.getElementById('wordListWrap').innerHTML = `<div class="empty-state">${icon('content',46)}<p>محتوای کلمات فعلاً فقط برای آلمانی موجود است.</p></div>`;
      return;
    }
    await loadContentWords();
  }

  async function loadContentWords(){
    const wrap = document.getElementById('wordListWrap');
    if (wrap) wrap.innerHTML = `<div class="empty-state"><span class="loading-spin"></span></div>`;
    if (state.contentLang !== 'de') {
      if (wrap) wrap.innerHTML = `<div class="empty-state">${icon('content',46)}<p>محتوای کلمات فعلاً فقط برای آلمانی موجود است.</p></div>`;
      return;
    }
    try {
      const file = CURRICULUM_FILES[state.contentLevel];
      const [res, overridesSnap] = await Promise.all([
        fetch(file),
        fbDb.ref('contentOverrides/' + state.contentLang + '/' + state.contentLevel).once('value'),
      ]);
      const base = res.ok ? await res.json() : [];
      const overrides = overridesSnap.val() || null;
      state.contentOverrides = overrides;
      state.contentWords = applyOverrides(Array.isArray(base) ? base : [], overrides);
      paintWordList();
    } catch(e) {
      console.error('loadContentWords error:', e);
      toast('خطا در بارگذاری کلمات: ' + (e && e.message ? e.message : 'نامشخص'), 'err');
      const wrap2 = document.getElementById('wordListWrap');
      if (wrap2) wrap2.innerHTML = `<div class="empty-state">${icon('content',46)}<p>خطا در بارگذاری فایل کلمات.</p></div>`;
    }
  }

  function applyOverrides(baseWords, overrides){
    if (!overrides) return baseWords;
    let words = baseWords.slice();
    const deletes = new Set(overrides.deletes || []);
    if (deletes.size) words = words.filter(w => !deletes.has(String(w.id)));
    if (overrides.edits) words = words.map(w => (overrides.edits[String(w.id)] ? { ...w, ...overrides.edits[String(w.id)] } : w));
    if (Array.isArray(overrides.adds) && overrides.adds.length) words = words.concat(overrides.adds);
    return words;
  }

  function paintWordList(){
    const wrap = document.getElementById('wordListWrap');
    if (!wrap) return;
    let list = state.contentWords;
    if (state.contentSearch) {
      list = list.filter(w =>
        (w.de || '').toLowerCase().includes(state.contentSearch) ||
        (w.fa || '').toLowerCase().includes(state.contentSearch)
      );
    }
    if (list.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${icon('content', 46)}<p>کلمه‌ای یافت نشد.</p></div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="card" style="padding:0;overflow-x:auto">
        <table class="data-table">
          <thead><tr><th>کلمه</th><th>معنی</th><th>دسته</th><th></th></tr></thead>
          <tbody>
            ${list.map(w => `
              <tr>
                <td style="font-weight:600">${esc(w.de || '')}</td>
                <td>${esc(w.fa || '')}</td>
                <td style="color:var(--muted);font-size:12px">${esc(w.category || '—')}</td>
                <td>
                  <div style="display:flex;gap:6px;justify-content:flex-end">
                    <button class="icon-btn" title="ویرایش" onclick='__admin.openWordModal(${JSON.stringify(String(w.id))})'>${icon('edit',14)}</button>
                    <button class="icon-btn" title="حذف" onclick='__admin.deleteWord(${JSON.stringify(String(w.id))})'>${icon('trash',14)}</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div style="margin-top:10px;font-size:11.5px;color:var(--placeholder)">${faNum(list.length)} کلمه</div>
    `;
  }

  function openWordModal(wordId){
    const isNew = !wordId;
    const w = isNew ? { id: '', de: '', fa: '', category: '', frequencyText: '', contextDe: '', contextFa: '' }
                     : state.contentWords.find(x => String(x.id) === wordId);
    if (!w) return;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3>${isNew ? 'افزودن کلمه' : 'ویرایش کلمه'}</h3>
        <div class="modal-sub">سطح ${esc(state.contentLevel)} · ${LANGUAGE_META[state.contentLang].native}</div>
        <div class="mfield-row mfield-group">
          <div>
            <label class="mlabel">کلمه (آلمانی)</label>
            <input class="mfield" id="wDe" value="${esc(w.de || '')}">
          </div>
          <div>
            <label class="mlabel">معنی (فارسی)</label>
            <input class="mfield" id="wFa" value="${esc(w.fa || '')}">
          </div>
        </div>
        <div class="mfield-group">
          <label class="mlabel">دسته‌بندی</label>
          <input class="mfield" id="wCategory" value="${esc(w.category || '')}">
        </div>
        <div class="mfield-group">
          <label class="mlabel">جمله نمونه (آلمانی)</label>
          <input class="mfield" id="wContextDe" value="${esc(w.contextDe || '')}">
        </div>
        <div class="mfield-group">
          <label class="mlabel">معنی جمله نمونه (فارسی)</label>
          <input class="mfield" id="wContextFa" value="${esc(w.contextFa || '')}">
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="wordCancelBtn">انصراف</button>
          <button class="btn-confirm" id="wordSaveBtn">ذخیره</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#wordCancelBtn').addEventListener('click', () => backdrop.remove());
    backdrop.querySelector('#wordSaveBtn').addEventListener('click', async () => {
      const de = backdrop.querySelector('#wDe').value.trim();
      const fa = backdrop.querySelector('#wFa').value.trim();
      if (!de || !fa) { toast('کلمه و معنی هر دو الزامی هستند', 'err'); return; }
      const fields = {
        de, fa,
        category: backdrop.querySelector('#wCategory').value.trim(),
        contextDe: backdrop.querySelector('#wContextDe').value.trim(),
        contextFa: backdrop.querySelector('#wContextFa').value.trim(),
      };
      try {
        const basePath = 'contentOverrides/' + state.contentLang + '/' + state.contentLevel;
        if (isNew) {
          const newId = 'admin-' + Date.now();
          const addsRef = fbDb.ref(basePath + '/adds');
          const snap = await addsRef.once('value');
          const adds = snap.val() || [];
          adds.push({ id: newId, ...fields });
          await addsRef.set(adds);
        } else {
          await fbDb.ref(basePath + '/edits/' + wordId).update(fields);
        }
        toast('کلمه ذخیره شد', 'ok');
        backdrop.remove();
        state.contentWords = [];
        loadContentWords();
      } catch(e) { toast('خطا در ذخیره‌سازی', 'err'); }
    });
  }

  async function deleteWord(wordId){
    if (!confirm('این کلمه حذف شود؟')) return;
    try {
      const basePath = 'contentOverrides/' + state.contentLang + '/' + state.contentLevel;
      const deletesRef = fbDb.ref(basePath + '/deletes');
      const snap = await deletesRef.once('value');
      const deletes = snap.val() || [];
      if (!deletes.includes(wordId)) deletes.push(wordId);
      await deletesRef.set(deletes);
      toast('کلمه حذف شد', 'ok');
      state.contentWords = [];
      loadContentWords();
    } catch(e) { toast('خطا در حذف', 'err'); }
  }

    await loadAppStatus();

    await loadAiConfig();

    await loadBroadcasts();

  async function loadAppStatus(){
    try {
      const snap = await fbDb.ref('appStatus').once('value');
      const val = snap.val() || {};
      state.appStatus = { closed: !!val.closed, message: val.message || DEFAULT_MAINTENANCE_MSG };
      state.appStatusLoaded = true;
    } catch(e) {
      console.error('loadAppStatus error:', e);
      state.appStatus = { closed: false, message: DEFAULT_MAINTENANCE_MSG };
    }
  }

  function paintAppStatus(){
    const wrap = document.getElementById('appStatusWrap');
    if (!wrap) return;
    const closed = state.appStatus.closed;
    wrap.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:10px 13px;margin-bottom:14px">
        <span style="font-size:13px">${closed ? 'برنامه الان بسته است' : 'برنامه الان باز و در دسترس است'}</span>
        <span class="pill ${closed ? 'banned' : 'active'}">${closed ? icon('ban',11) + ' بسته' : icon('check',11) + ' باز'}</span>
      </div>
      <div class="mfield-group">
        <label class="mlabel">پیامی که به کاربران نمایش داده می‌شود</label>
        <textarea class="ta" id="appStatusMsg" style="min-height:70px">${esc(state.appStatus.message || DEFAULT_MAINTENANCE_MSG)}</textarea>
      </div>
      <div style="display:flex;gap:10px">
        ${closed
          ? `<button class="btn-confirm" id="appStatusToggleBtn" style="flex:1">${icon('power',14)} باز کردن برنامه</button>`
          : `<button class="btn-danger" id="appStatusToggleBtn" style="flex:1">${icon('power',14)} بستن برنامه</button>`}
      </div>
    `;
    document.getElementById('appStatusToggleBtn').addEventListener('click', () => saveAppStatus(!closed));
  }

  async function saveAppStatus(closed){
    const msgEl = document.getElementById('appStatusMsg');
    const message = (msgEl ? msgEl.value.trim() : state.appStatus.message) || DEFAULT_MAINTENANCE_MSG;
    if (closed && !confirm('مطمئنی می‌خوای برنامه رو برای همه‌ی کاربران ببندی؟')) return;
    try {
      await fbDb.ref('appStatus').set({ closed: !!closed, message, updatedAt: Date.now() });
      state.appStatus = { closed: !!closed, message };
      toast(closed ? 'برنامه بسته شد' : 'برنامه باز شد', 'ok');
      paintAppStatus();
    } catch(e) { toast('خطا در ذخیره‌سازی وضعیت برنامه', 'err'); }
  }

  // --- کلید مرکزی Gemini — aiConfig/geminiKey ---
  // فقط از همین پنل مدیریت نوشته/خونده می‌شه؛ کاربرهای عادی فقط وقتی permissions/{uid}/canUseAi
  // روشون true باشه می‌تونن (طبق قوانین امنیتی فایربیس) این مسیر رو بخونن. نگاه کن به index.html
  // (تابع attachAiAccessListener) برای دیدن این‌که اپ اصلی چطور ازش استفاده می‌کنه.
  async function loadAiConfig(){
    try {
      const snap = await fbDb.ref('aiConfig/geminiKey').once('value');
      state.aiConfigKey = snap.val() || '';
      state.aiConfigLoaded = true;
    } catch(e) {
      console.error('loadAiConfig error:', e);
      state.aiConfigKey = '';
    }
  }

  function paintAiConfig(){
    const wrap = document.getElementById('aiConfigWrap');
    if (!wrap) return;
    const hasKey = !!(state.aiConfigKey && state.aiConfigKey.trim());
    wrap.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:10px 13px;margin-bottom:14px">
        <span style="font-size:13px">${hasKey ? 'یک کلید Gemini ذخیره شده' : 'هنوز کلیدی ذخیره نشده'}</span>

      <button class="btn-confirm" id="aiConfigSaveBtn" style="width:auto;padding:10px 20px">ذخیره کلید</button>

    document.getElementById('aiConfigKeyToggleBtn').addEventListener('click', () => {
      state.showAiConfigKey = !state.showAiConfigKey;
      paintAiConfig();

  async function saveAiConfigKey(){
    const el = document.getElementById('aiConfigKeyInput');
    const key = el ? el.value.trim() : '';
    try {
      await fbDb.ref('aiConfig/geminiKey').set(key);
      state.aiConfigKey = key;

  async function loadBroadcasts(){
    try {
      const snap = await fbDb.ref('broadcastNotifications').orderByChild('createdAt').limitToLast(50).once('value');
      const val = snap.val() || {};
      state.broadcasts = Object.keys(val).map(id => ({ id, ...val[id] })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      state.broadcastsLoaded = true;
    } catch(e) {
      console.error('loadBroadcasts error:', e);
      state.broadcasts = [];
    }

  function paintBroadcastList(){

    if (!wrap) return;

    const now = Date.now();
    wrap.innerHTML = state.broadcasts.map(b => {
      const pending = (b.sendAt || 0) > now;
      return `
        <div class="index-card" style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px">

          <div style="font-size:13px;line-height:1.8">${esc(b.message || '')}</div>
          ${pending ? `<div style="margin-top:10px"><button class="btn-small" onclick="__admin.cancelBroadcast('${esc(b.id)}')">${icon('trash',12)} لغو ارسال</button></div>` : ''}
        </div>
      `;
    }).join('');
  }

  async function sendBroadcast(){
    const msgEl = document.getElementById('bcMessage');
    const message = msgEl ? msgEl.value.trim() : '';
    if (!message) { toast('متن نوتیفیکیشن نمی‌تونه خالی باشه', 'err'); return; }
    const delaySel = document.getElementById('bcDelay').value;
    let delayHours = 0;
    if (delaySel === 'custom') {
      delayHours = parseFloat(document.getElementById('bcCustomHours').value) || 0;
    } else {
      delayHours = parseFloat(delaySel) || 0;
    }
    const now = Date.now();
    const sendAt = now + Math.max(0, delayHours) * 3600000;
    try {
      const ref = fbDb.ref('broadcastNotifications').push();
      await ref.set({ message, createdAt: now, sendAt, createdBy: state.email || state.uid || null });
      toast(delayHours > 0 ? 'نوتیفیکیشن زمان‌بندی شد' : 'نوتیفیکیشن ارسال شد', 'ok');
      msgEl.value = '';
      await loadBroadcasts();
      paintBroadcastList();
    } catch(e) { toast('خطا در ارسال نوتیفیکیشن', 'err'); }
  }

  async function cancelBroadcast(id){
    if (!confirm('این نوتیفیکیشن زمان‌بندی‌شده لغو شود؟')) return;
    try {
      await fbDb.ref('broadcastNotifications/' + id).remove();
      state.broadcasts = state.broadcasts.filter(b => b.id !== id);
      toast('لغو شد', 'ok');
      paintBroadcastList();
    } catch(e) { toast('خطا در لغو', 'err'); }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw-admin.js').catch((e) => console.error('Admin SW registration failed', e));
    });
  }
})();
</script>
</body>
</html>
